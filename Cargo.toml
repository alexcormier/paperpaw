[workspace.package]
version = "0.4.0-dev"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hthoene/paperpaw"
homepage = "https://github.com/hthoene/paperpaw"
authors = ["Hannes Thoene", "The PaperPaw contributors"]

