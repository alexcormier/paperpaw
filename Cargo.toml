    "crates/paperpaw-xml",
    "crates/paperpaw-stardict",
    "crates/paperpaw-sdk",
    "crates/paperpaw-core",
    "crates/paperpaw-app",
    "crates/paperpaw-fs",
    "crates/paperpaw-x4",
    "crates/paperpaw-fat",
    "crates/paperpaw-update",
    "crates/paperpaw-digest",
    "crates/paperpaw-json",
    "crates/paperpaw-qr",
    "plugins/diagnostics",
    "plugins/dictionary",
    "plugins/fonts-default",
    "plugins/fonts-browser",
    "plugins/store",
    "plugins/format-txt",
    "plugins/format-epub",
    "plugins/format-xtc",
    "plugins/reader",
    "plugins/files",
    "plugins/menu",
    "plugins/menu-editor",
    "plugins/kosync",
    "plugins/calibre",
    "plugins/stats",
    "plugins/battery",
    "plugins/wifi",
    "plugins/file-manager",
    "plugins/transfer",
    "plugins/browser",
    "plugins/opds",
    "plugins/rules",
    "plugins/lock",
    "plugins/profiles",
    "plugins/keys",
    "plugins/wikipedia",
    "plugins/aids",
    "plugins/vocabulary",
    "plugins/sleep",
    "plugins/translate",
    "plugins/readwise",
    "plugins/koreader",
    "plugins/wallabag",
    "plugins/about",
