# A design direction to try (an experiment, nothing decided): a theme is
# a data plugin with new defaults for the appearance settings. Copy this
# folder into the `plugins` folder of your device and restart.
[plugin]
id = theme-paw
name = Paw
description = Round and friendly: pills everywhere, a frame for the highlight, no lines, a paw on empty screens.
version = 0.1.0
formats = 1
