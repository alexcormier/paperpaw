# The plugin's entry in the plugin library for the pull request way: the
# file catalogue/<id>.toml (here hello.toml) in the paperpaw.org
# repository. The upload form needs no such file: it reads
# plugin/store/store.ini. Every field is checked, and one the catalogue
# does not know is refused: add none of your own. Replace every value in
# capitals; https://paperpaw.org/authors#pull-request says what each field takes.

# The plugin's id: the file's name and plugin.ini's id.
id = "hello"
name = "Hello"
# One sentence, at most 160 characters.
summary = "A sample plugin to start from: an action, a screen, a setting."
description = "Shows a greeting and counts the books opened since the start."
kind = "code"
author = "YOUR NAME"
# The public key: the 64 digits in brackets on the signer line of
# `paperpaw-sign plugin dist/hello-0.1.0-x4.ppn`. Never the key file.
author_key = "YOUR PUBLIC KEY"
licence = "Apache-2.0"
# Where the source lives, shown as the plugin's home.
source = "https://github.com/YOUR-NAME/YOUR-REPOSITORY"
group = "system"
tags = ["sample"]
# Every reader it has a build for, and no other.
devices = ["x4", "x4-pro"]

[i18n.de]
name = "Hallo"
summary = "Ein Beispiel-Plugin für den Anfang: eine Aktion, ein Bildschirm, eine Einstellung."

# One [[versions]] for each release: the CI job writes it for a tag
# (dist/catalogue-versions.toml, attached to the release). Newer
# versions are added below; older ones stay.
[[versions]]
version = "0.1.0"
sdk = "0.5"
date = "YYYY-MM-DD"
# The folder without store/ and without code.ppn, as a ZIP elsewhere.
url = "https://github.com/YOUR-NAME/YOUR-REPOSITORY/releases/download/v0.1.0/hello-0.1.0.zip"
sha256 = "SHA-256 OF THE ZIP, FROM SHA256SUMS"

[versions.source]
repository = "https://github.com/YOUR-NAME/YOUR-REPOSITORY"
revision = "v0.1.0"
bin = "hello"

[[versions.builds]]
device = "x4"
abi = "FINGERPRINT, 16 HEXADECIMAL DIGITS"
url = "https://github.com/YOUR-NAME/YOUR-REPOSITORY/releases/download/v0.1.0/hello-0.1.0-x4.ppn"
sha256 = "SHA-256 OF THE FILE, FROM SHA256SUMS"

[[versions.builds]]
device = "x4-pro"
abi = "FINGERPRINT, 16 HEXADECIMAL DIGITS"
url = "https://github.com/YOUR-NAME/YOUR-REPOSITORY/releases/download/v0.1.0/hello-0.1.0-x4-pro.ppn"
sha256 = "SHA-256 OF THE FILE, FROM SHA256SUMS"
