[package]
name = "paperpaw-sample-hello-native"
description = "The SDK's sample plugin as a native plugin file for the Xteink X4 and X4 Pro"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as a plugin's own repository is: the file it
# makes must fit firmware built elsewhere.
[workspace]

[[bin]]
name = "hello"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# A plugin's own repository names the SDK by the release it is built for,
# e.g. `paperpaw-sdk = "0.5.0-beta.7"`; here it is the repository's.
paperpaw-sdk = { path = "../../crates/paperpaw-sdk" }
# The plugin itself: a crate of its own, tested on a computer and tried
# in the emulator like any other.
paperpaw-sample-hello = { path = "../hello-plugin" }

# As the firmware is built: small code, one unit, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Lines in the ELF, for naming the functions of a crash's calls.
debug = "line-tables-only"
