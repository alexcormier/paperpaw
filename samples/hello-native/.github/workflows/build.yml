# A CI job for a native PaperPaw plugin's own repository (copy this
# folder's files to start one): on every tag it builds the plugin for the
# Xteink X4 and the X4 Pro with ./build.sh, packs both files and signs
# them with the author's key, and attaches them, the plugin's folder as
# ZIPs and their SHA-256 sums to the tag's release, for the upload form
# of the plugin library. build.sh writes paths as the same in any folder,
# as the library's rebuild does, so the files can be verified against
# their source. Nothing here runs in PaperPaw's own repository.
#
# The author's key: `paperpaw-sign key author.key` once, outside the
# repository, then its contents as the repository's secret
# PAPERPAW_PLUGIN_KEY. Keep the file safe and never commit it: devices
# remember the key at the first install and warn when an update is signed
# by another.
name: Build

on:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # The PaperPaw release the plugin is built for, and its compilers: a
  # file runs only on firmware built by the same ones (the device's
  # *About* names them; PaperPaw's shells/xteink/rust-toolchain.toml and
  # versions.env of that release pin them). RUST_X4 is also this
  # repository's rust-toolchain.toml.
  PAPERPAW: "0.5.0-beta.8"
  RUST_X4: "1.99.0"
  RUST_X4_PRO: "1.97.0.0"
  ESP_GCC: "14.2.0_20241119"
  # The plugin's binary crate, as in Cargo.toml.
  PLUGIN: hello

jobs:
  build:
    name: X4 and X4 Pro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilers
        run: |
          rustup toolchain install "$RUST_X4" --profile minimal --target riscv32imc-unknown-none-elf
          curl -sSfL https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/espup"
          chmod +x "$RUNNER_TEMP/espup"
          "$RUNNER_TEMP/espup" install --targets esp32s3 --toolchain-version "$RUST_X4_PRO" \
            --crosstool-toolchain-version "$ESP_GCC"
      - name: paperpaw-sign, of the release
        run: cargo "+$RUST_X4" install --locked --git https://github.com/hthoene/paperpaw --tag "v$PAPERPAW" paperpaw-sign
      # The X4 Pro's core libraries, built once by the release and signed
      # with PaperPaw's release key, into the esp toolchain (as rustup has
      # the X4's): every build of the plugin is then the same.
      - name: The X4 Pro's core libraries, of the release
        run: |
          archive="paperpaw-xtensa-std-$PAPERPAW.tar.gz"
          base="https://github.com/hthoene/paperpaw/releases/download/v$PAPERPAW"
          curl -sSfL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -sSfL "$base/$archive.sig" -o "$RUNNER_TEMP/$archive.sig"
          # PaperPaw's release key, whole (fingerprint 55A9 F626 DB17 EB90).
          paperpaw-sign check-asset "$RUNNER_TEMP/$archive" "$RUNNER_TEMP/$archive.sig" \
            | tee /dev/stderr | grep -q "(55a9f626db17eb9058707323d29f52470bfcd09638898e17bd01784ef9df0c51)"
          sysroot="$(rustc +esp --print sysroot)"
          rm -rf "$sysroot/lib/rustlib/xtensa-esp32s3-none-elf"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$sysroot"
      - name: The tag is the plugin's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version *= *//p' plugin/plugin.ini | tr -d '\r' | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "the tag is $GITHUB_REF_NAME, plugin/plugin.ini says version $version" >&2
            exit 1
          fi
      - name: Build, pack and sign
        env:
          PAPERPAW_PLUGIN_KEY: ${{ secrets.PAPERPAW_PLUGIN_KEY }}
        run: |
          . "$HOME/export-esp.sh"
          if [ -n "$PAPERPAW_PLUGIN_KEY" ]; then
            key="$RUNNER_TEMP/author.key"
            (umask 077 && printf '%s\n' "$PAPERPAW_PLUGIN_KEY" > "$key")
            ./build.sh --key "$key"
            rm -f "$key"
          else
            # A pull request from a fork has no secrets: unsigned files.
            ./build.sh
          fi
          for ppn in dist/*.ppn; do
            if [ -n "$PAPERPAW_PLUGIN_KEY" ]; then paperpaw-sign check-plugin "$ppn"; else paperpaw-sign plugin "$ppn"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
