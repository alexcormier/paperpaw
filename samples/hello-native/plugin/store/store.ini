# What the plugin library shows of the plugin, for the upload form on
# paperpaw.org (https://paperpaw.org/authors#store-ini). Only the store
# reads store/; it is taken out of what readers install. Every key is
# optional: the form asks for what is missing.
# Comments go on lines of their own, never after a value.

[store]
# One sentence, at most 160 characters.
summary = A sample plugin to start from: an action, a screen, a setting.
# At most 2000 characters, one line (in quotes, \n for a new line).
description = Shows a greeting and counts the books opened since the start.
# One of: reading, formats, library, sync, home, look, system.
group = system
# At most five, separated by commas.
tags = sample
# An SPDX identifier.
licence = Apache-2.0
# Where the source lives, an https address.
source = https://github.com/YOUR-NAME/YOUR-REPOSITORY
# The PaperPaw SDK it is built against.
sdk = 0.5

[source]
# The exact source of the builds: a public repository on github.com,
# codeberg.org or gitlab.com, and the tag (or 40-digit commit) built.
repository = https://github.com/YOUR-NAME/YOUR-REPOSITORY
revision = v0.1.0
# The binary to pack: the sample's package is paperpaw-sample-hello-native,
# its binary hello.
bin = hello

[i18n.de]
name = Hallo
summary = Ein Beispiel-Plugin für den Anfang: eine Aktion, ein Bildschirm, eine Einstellung.
