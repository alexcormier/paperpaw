name: Release

# A tag `v1.2.3` (the workspace's version) makes a GitHub release with the
# Android app signed with the release key, the Xteink X4's firmware (one
# image for its whole flash, which paperpaw.org offers for flashing in the
# browser, with a signature file of its own, and the update file, both
# signed with the firmware's key; the update is installed on the device),
# their checksums, and the release notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the workspace's version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The tools F-Droid builds with too: the same app, byte for byte.
      - uses: ./.github/actions/android-tools
      - name: Build the app, signed with the release key
        env:
          PAPERPAW_REPRODUCIBLE: 1
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PAPERPAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAPERPAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAPERPAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::the secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          export PAPERPAW_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PAPERPAW_KEYSTORE"
          [[ -n "$PAPERPAW_KEY_PASSWORD" ]] || unset PAPERPAW_KEY_PASSWORD
          shells/android/build-apk.sh
          rm -f "$PAPERPAW_KEYSTORE"
          mkdir -p dist
          cp target/android/paperpaw.apk "dist/paperpaw-$VERSION.apk"
          (cd dist && sha256sum "paperpaw-$VERSION.apk" > "paperpaw-$VERSION.apk.sha256")
      # As F-Droid checks it: its own build, unsigned, must verify with the
      # signature of this one.
      - name: The signature fits the unsigned build
        env:
          PAPERPAW_REPRODUCIBLE: 1
          PAPERPAW_UNSIGNED: 1
        run: |
          shells/android/build-apk.sh
          pipx install apksigcopier==1.1.1
          PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION:$PATH" apksigcopier compare \
            "dist/paperpaw-$VERSION.apk" --unsigned target/android/paperpaw-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/paperpaw-*.apk*

  x4:
    name: Xteink X4 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the workspace's version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      # The version the images are made with: it brings the bootloader.
      - name: espflash
        run: |
          sudo apt-get update && sudo apt-get install -y libudev-dev
          cargo install espflash@4.6.0 --locked
      # One image for the whole flash (with the partitions of
      # `partitions.csv`, from `espflash.toml`), and the app alone for
      # updates.
      - name: Build the firmware
        working-directory: shells/xteink
        # Without remote control over USB, which is for testing.
        run: |
          cargo build --release --no-default-features
          mkdir -p "$GITHUB_WORKSPACE/dist"
          elf=target/riscv32imc-unknown-none-elf/release/paperpaw-xteink
          espflash save-image --chip esp32c3 --merge --skip-padding --flash-size 16mb \
            "$elf" "$GITHUB_WORKSPACE/dist/paperpaw-x4-$VERSION.bin"
          espflash save-image --chip esp32c3 --flash-size 16mb "$elf" "$RUNNER_TEMP/app.bin"
      - name: Sign the update and the flash image with the firmware's key
        env:
          PAPERPAW_SIGNING_KEY: ${{ secrets.PAPERPAW_SIGNING_KEY }}
        run: |
          if [[ -z "$PAPERPAW_SIGNING_KEY" ]]; then
            echo "::error::no PAPERPAW_SIGNING_KEY: devices install only signed updates"
            exit 1
          fi
          cargo run --release -p paperpaw-sign -- sign \
            "$RUNNER_TEMP/app.bin" "dist/paperpaw-x4-$VERSION-update.bin"
          # The web flasher checks the whole image against this.
          cargo run --release -p paperpaw-sign -- sign-apart \
            "dist/paperpaw-x4-$VERSION.bin" "dist/paperpaw-x4-$VERSION.bin.sig"
          cd dist
          sha256sum "paperpaw-x4-$VERSION.bin" > "paperpaw-x4-$VERSION.bin.sha256"
          sha256sum "paperpaw-x4-$VERSION-update.bin" > "paperpaw-x4-$VERSION-update.bin.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: x4
          path: dist/paperpaw-x4-*

  release:
    name: Release
    needs: [android, x4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: The version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          # The section of this version, up to the next one.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ "$VERSION" == 0.* || "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${prerelease[@]}" \
            --title "PaperPaw $VERSION" --notes-file dist/notes.md \
            "dist/paperpaw-$VERSION.apk" "dist/paperpaw-$VERSION.apk.sha256" \
            "dist/paperpaw-x4-$VERSION.bin" "dist/paperpaw-x4-$VERSION.bin.sha256" \
            "dist/paperpaw-x4-$VERSION.bin.sig" \
            "dist/paperpaw-x4-$VERSION-update.bin" "dist/paperpaw-x4-$VERSION-update.bin.sha256"
