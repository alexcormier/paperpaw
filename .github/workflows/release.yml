name: Release

# A tag `v1.2.3` (the workspace's version) makes a GitHub release with the
# Android app signed with the release key and the firmware of the Xteink
# X4 and X4 Pro, and of the X4 Classic and the X3, which are experimental
# (not yet tried on one; paperpaw.org offers them as such). For each device: one
# image for its whole
# flash (which paperpaw.org offers for flashing in the browser) with a
# signature file of its own, and the update file, both signed with the
# firmware's key (the update is installed on the device); the list of the
# plugins built in; the fingerprint native code plugins must have to run
# on it (ADR 0024); their checksums. The core libraries code plugins for
# the ESP32-S3 link with (`paperpaw-xtensa-std-<version>.tar.gz`,
# tools/xtensa-std), built once here, with a checksum and a signature of
# their own. PaperPaw's own plugins that the store
# offers (tools/plugin-files) come as files for each device, signed with
# the first-party plugin key, with their folders and their entries for
# the plugin library (`paperpaw-<version>-catalogue.zip`); each keeps
# its own version (its crate's), the release builds it again for its
# firmware. The web
# emulator (shells/web) comes as its module and its pages
# (`paperpaw-web-<version>.zip`), for pages that show PaperPaw in a
# browser (paperpaw.org's "Try it out"), with its SHA-256 and a signature
# of its own as the emulators below. For tools that work with a release without a build of their
# own (the workshop): the desktop emulator for each computer
# (`paperpaw-emu-<version>-<target>.zip`, with paperpaw-dev for
# `--check` and paperpaw-sign for signing plugins), driven over `--stdio` and loading code plugins built for
# the computer, and the handbook (`paperpaw-handbook-<version>.zip`:
# registry, check codes, docs, samples, the SDK's items and source,
# PaperPaw's own plugins as examples), and for people who make their own
# font packs: `paperpaw-fontgen` for each computer
# (`paperpaw-fontgen-<version>-<target>.zip`); each
# with its SHA-256 and a signature of its own, made with the firmware's
# key over a domain of its own (`paperpaw-sign check-asset` reads it). The release notes come from
# CHANGELOG.md.
# Only tags of PaperPaw's versions: a plugin's update between releases is
# published by store-plugin.yml.
#
# The plugins' files do not go into the release (#89): a release of 73
# files is a page one can read. Every plugin file, the folders' ZIPs
# included, goes to the store release of the year (`plugins-<year>`, a
# pre-release that is added to and never replaced, `store_release.py`),
# only those of versions not published before; the catalogue in this
# release names each file by the release that holds it. They are uploaded
# before this release is made, so that paperpaw.org never reads an address
# that has no file.
#
# A dry run (run the workflow by hand, with the version of the workspace,
# from a branch): everything is built and signed with throw-away keys (the
# real ones are for a tag only), the store release's and this release's
# `gh` commands are printed and their lists checked
# (`tools/plugin-files/release_assets.py`), and nothing is made or
# uploaded. A release is made by a tag alone.
on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: The workspace's version to try (e.g. 0.6.0-beta.3), for a dry run
        required: true
      dry_run:
        description: "Always on (a release is made by a tag, never by hand)"
        type: boolean
        default: true

# Read only: the build jobs run the repository's code and its dependencies'
# build scripts, so their token cannot write a release or a tag. Only the
# `release` job writes (it runs the tag's code too, but after every file is
# built; no job keeps the token in .git/config: persist-credentials false).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The tag this run is for: the pushed one, or for a dry run the version's.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  DRY_RUN: ${{ github.event_name == 'push' && 'false' || 'true' }}

jobs:
  guard:
    name: A release is made by a tag
    runs-on: ubuntu-latest
    steps:
      - env:
          DRY_INPUT: ${{ inputs.dry_run }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push && "$DRY_INPUT" != true ]]; then
            echo "::error::a release is made by pushing a tag; by hand only a dry run (dry_run on)"
            exit 1
          fi
          if [[ "$DRY_RUN" == true ]]; then
            echo "::notice::DRY RUN of $RELEASE_TAG: no tag, no release, no upload"
          fi

  android:
    name: Android app
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag is the workspace's version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The tools F-Droid builds with too: the same app, byte for byte.
      - uses: ./.github/actions/android-tools
      - name: Build the app, signed with the release key
        if: env.DRY_RUN != 'true'
        env:
          PAPERPAW_REPRODUCIBLE: 1
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PAPERPAW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PAPERPAW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PAPERPAW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::the secret ANDROID_KEYSTORE_BASE64 is missing"
            exit 1
          fi
          export PAPERPAW_KEYSTORE="$RUNNER_TEMP/release.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$PAPERPAW_KEYSTORE"
          [[ -n "$PAPERPAW_KEY_PASSWORD" ]] || unset PAPERPAW_KEY_PASSWORD
          shells/android/build-apk.sh
          rm -f "$PAPERPAW_KEYSTORE"
          mkdir -p dist
          cp target/android/paperpaw.apk "dist/paperpaw-$VERSION.apk"
          (cd dist && sha256sum "paperpaw-$VERSION.apk" > "paperpaw-$VERSION.apk.sha256")
      # A dry run has no keystore (the real one is for a tag): the unsigned
      # app takes the signed one's place, for the list of files.
      - name: Build the app, unsigned (a dry run)
        if: env.DRY_RUN == 'true'
        env:
          PAPERPAW_REPRODUCIBLE: 1
          PAPERPAW_UNSIGNED: 1
        run: |
          shells/android/build-apk.sh
          mkdir -p dist
          cp target/android/paperpaw-unsigned.apk "dist/paperpaw-$VERSION.apk"
          (cd dist && sha256sum "paperpaw-$VERSION.apk" > "paperpaw-$VERSION.apk.sha256")
      # As F-Droid checks it: its own build, unsigned, must verify with the
      # signature of this one.
      - name: The signature fits the unsigned build
        if: env.DRY_RUN != 'true'
        env:
          PAPERPAW_REPRODUCIBLE: 1
          PAPERPAW_UNSIGNED: 1
        run: |
          shells/android/build-apk.sh
          pipx install apksigcopier==1.1.1
          PATH="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION:$PATH" apksigcopier compare \
            "dist/paperpaw-$VERSION.apk" --unsigned target/android/paperpaw-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/paperpaw-*.apk*

  web:
    name: Web emulator
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the module, its size kept in bounds
        run: python3 shells/web/build.py --limit-mb 16.8
      - name: The module and its pages
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          # Everything the pages load, as it lies in its folder, so that it
          # runs from any path (its URLs are relative).
          (cd shells/web/www && zip -q -X -r "../../../dist/paperpaw-web-$version.zip" . -x .gitignore)
          # Its licence and the notices of what it holds (tools/licences).
          zip -q -X -j "dist/paperpaw-web-$version.zip" LICENSE NOTICE
          (cd dist && sha256sum "paperpaw-web-$version.zip" > "paperpaw-web-$version.zip.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: dist/paperpaw-web-*

  emulator:
    name: Emulator (${{ matrix.target }})
    needs: [guard]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Intel Macs from an Apple silicon runner (GitHub has retired the
        # Intel ones): built for x86_64-apple-darwin there, not run.
        include:
          - { os: windows-latest, target: windows-x64, rust: "" }
          - { os: macos-14, target: macos-arm64, rust: "" }
          - { os: macos-14, target: macos-x64, rust: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: linux-x64, rust: "" }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The toolchain of rust-toolchain.toml: code plugins built for the
      # computer must be built with it (`--stdio` says it).
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the emulator, paperpaw-dev, paperpaw-sign and paperpaw-fontgen
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust }}
          # What `--stdio` says it is built from (shells/desktop/build.rs;
          # whether it is the release, Git says by the tag).
          PAPERPAW_COMMIT: ${{ github.sha }}
        run: |
          version="${RELEASE_TAG#v}"
          built=target/release
          if [[ -n "$RUST_TARGET" ]]; then
            rustup target add "$RUST_TARGET"
            cargo build --release --target "$RUST_TARGET" -p paperpaw-emulator -p paperpaw-dev -p paperpaw-sign -p paperpaw-fontgen
            built="target/$RUST_TARGET/release"
          else
            cargo build --release -p paperpaw-emulator -p paperpaw-dev -p paperpaw-sign -p paperpaw-fontgen
          fi
          exe=""
          [[ "$RUNNER_OS" == Windows ]] && exe=.exe
          mkdir -p dist/pkg
          tools=("paperpaw-emu$exe" "paperpaw-dev$exe" "paperpaw-sign$exe")
          for tool in "${tools[@]}"; do cp "$built/$tool" dist/pkg/; done
          # Their licence and the notices of what they hold (tools/licences).
          cp LICENSE NOTICE dist/pkg/
          # Where it runs as built: it answers over --stdio, as the
          # release of its version (the tag is the workspace's version).
          if [[ -z "$RUST_TARGET" ]]; then
            printf '%s\n' '{"op": "quit"}' | dist/pkg/paperpaw-emu$exe --stdio > ready.json
            grep -q '"event": "ready"' ready.json
            # A tagged commit says "release": true; a dry run has no tag, so it says false.
            if [[ "$DRY_RUN" == true ]]; then
              grep -q '"release": false' ready.json
            else
              grep -q '"release": true' ready.json
            fi
            rm ready.json
          fi
          name="paperpaw-emu-$version-${{ matrix.target }}.zip"
          py="$(command -v python3 || command -v python)"
          (cd dist/pkg && "$py" -m zipfile -c "../$name" "${tools[@]}" LICENSE NOTICE)
          rm -r dist/pkg
          # `paperpaw-fontgen` in a zip of its own, for who makes font
          # packs (not the workshop's emulator zip, whose tools it expects).
          mkdir -p dist/fontgen
          cp "$built/paperpaw-fontgen$exe" LICENSE NOTICE dist/fontgen/
          fontgen="paperpaw-fontgen-$version-${{ matrix.target }}.zip"
          (cd dist/fontgen && "$py" -m zipfile -c "../$fontgen" "paperpaw-fontgen$exe" LICENSE NOTICE)
          rm -r dist/fontgen
          # Where it runs as built: it prints its usage.
          if [[ -z "$RUST_TARGET" ]]; then
            "$built/paperpaw-fontgen$exe" --help > fontgen-usage.txt
            grep -q "paperpaw-fontgen" fontgen-usage.txt
            rm fontgen-usage.txt
          fi
          grep -q "^paperpaw-fontgen$exe " <<< "$("$py" -m zipfile -l "dist/$fontgen")" \
            || { echo "$fontgen has no paperpaw-fontgen"; exit 1; }
          # The zip holds all three tools, as tools taking it expect.
          listed="$("$py" -m zipfile -l "dist/$name")"
          for tool in "${tools[@]}"; do
            grep -q "^$tool " <<< "$listed" || { echo "$name has no $tool"; exit 1; }
          done
      - uses: actions/upload-artifact@v7
        with:
          name: emulator-${{ matrix.target }}
          path: |
            dist/paperpaw-emu-*.zip
            dist/paperpaw-fontgen-*.zip

  handbook:
    name: Handbook
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: The handbook of this release
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cargo run --release -p paperpaw-emulator -- --registry "$RUNNER_TEMP/registry.json"
          python3 tools/handbook.py "$RUNNER_TEMP/registry.json" "$version" \
            "dist/paperpaw-handbook-$version.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: handbook
          path: dist/paperpaw-handbook-*.zip

  # The core libraries code plugins for the ESP32-S3 link with, built once
  # on Linux: plugins built against them are the same on every computer,
  # which -Zbuild-std is not (Cargo hashes the libraries' folder as the
  # system writes it).
  xtensa-std:
    name: Core libraries for the ESP32-S3
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/xteink-tools
        with:
          device: x4-pro
      - name: Build them
        run: tools/xtensa-std/build.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: xtensa-std
          path: dist/paperpaw-xtensa-std-*.tar.gz

  firmware:
    name: Firmware (${{ matrix.device }})
    needs: [xtensa-std]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # As the release step lists them (the X4 Classic and the X3
        # experimental).
        device: [x4, x4-pro, x4-classic, x3]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: The tag is the workspace's version
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "::error::tag $RELEASE_TAG, but Cargo.toml says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The toolchain named in shells/xteink, and the espflash the images
      # are made with: it brings the bootloader.
      - uses: ./.github/actions/xteink-tools
        with:
          device: ${{ matrix.device }}
          espflash: true
      # The release's core libraries, which its store plugins for the
      # ESP32-S3 link with.
      - uses: actions/download-artifact@v8
        if: matrix.device != 'x4' && matrix.device != 'x3'
        with:
          name: xtensa-std
          path: ${{ runner.temp }}/xtensa-std
      - uses: ./.github/actions/xtensa-std
        if: matrix.device != 'x4' && matrix.device != 'x3'
        with:
          archive: ${{ runner.temp }}/xtensa-std/paperpaw-xtensa-std-${{ env.VERSION }}.tar.gz
      # One image for the whole flash (with the partitions of
      # `partitions.csv`, the X4 Classic's of `partitions-classic.csv`);
      # the app alone after it.
      - name: Build the firmware
        working-directory: shells/xteink
        # Without remote control over USB, which is for testing.
        run: |
          cargo +"$FIRMWARE_TOOLCHAIN" build $FIRMWARE_CARGO --features "$DEVICE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          elf="target/$FIRMWARE_TARGET/release/paperpaw-xteink"
          table=partitions.csv
          if [[ "$DEVICE" == x4-classic ]]; then
            table=partitions-classic.csv
          fi
          espflash save-image --chip "$FIRMWARE_CHIP" --merge --skip-padding --flash-size 16mb \
            --partition-table "$table" "$elf" "$GITHUB_WORKSPACE/dist/paperpaw-$DEVICE-$VERSION.bin"
      # The app alone, unsigned: what another firmware's installer
      # (CrossPoint's menu) takes, and what the signed update is made of.
      - name: The install image
        uses: ./.github/actions/install-image
        with:
          out: ${{ github.workspace }}/dist/paperpaw-${{ matrix.device }}-${{ env.VERSION }}-install.bin
      # Never an image that cannot take the next update: its own table has
      # two app slots, read as the firmware reads it, and its app is one
      # the bootloader maps whole and that fits them (and CrossPoint's).
      - name: Updates have somewhere to go
        run: cargo run -q --release -p paperpaw-sign -- check-image "dist/paperpaw-$DEVICE-$VERSION.bin"
      # Which code plugins run on it, for the plugin library and authors:
      # the fingerprint (16 hexadecimal digits, the first line, which
      # store-plugin.yml reads), then its table for plugins (`interface:`,
      # `api:`, `families:`, `min:`), as the firmware's ELF file says them,
      # for the store and the web flasher.
      - name: The sample code plugin fits the firmware
        id: native
        uses: ./.github/actions/native-sample
      - name: The fingerprint and the table
        env:
          FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: |
          abi="dist/paperpaw-$DEVICE-$VERSION-abi.txt"
          cargo run -q --release -p paperpaw-sign -- abi \
            "shells/xteink/target/$FIRMWARE_TARGET/release/paperpaw-xteink" > "$abi"
          cat "$abi"
          if [[ "$(head -n 1 "$abi")" != "$FINGERPRINT" ]]; then
            echo "::error::$abi does not begin with the fingerprint $FINGERPRINT"
            exit 1
          fi
      # PaperPaw's own plugins that the store offers, built for this
      # firmware (ADR 0024) and signed with the first-party plugin key (its
      # public key is the catalogue's `author_key`; never the firmware's).
      # Not for the X3 yet: the plugin library does not list it.
      - name: The store's first-party plugins
        if: matrix.device != 'x3'
        env:
          FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: |
          tools/plugin-files/build.sh "$DEVICE" dist/plugins --fingerprint "$FINGERPRINT"
          # The signing tool, built before the key comes near the disk.
          cargo build -q --release -p paperpaw-sign
      # A dry run signs with keys made for the job (the real ones are for a
      # tag only).
      - uses: ./.github/actions/dry-run-keys
      # Apart from every build: the key is on the disk only while the
      # files are signed (audit O-17).
      - name: Sign the store's first-party plugins
        if: matrix.device != 'x3'
        env:
          PAPERPAW_PLUGIN_KEY: ${{ github.event_name == 'push' && secrets.PAPERPAW_PLUGIN_KEY || env.PAPERPAW_PLUGIN_KEY }}
        run: |
          if [[ -z "$PAPERPAW_PLUGIN_KEY" ]]; then
            echo "::error::no PAPERPAW_PLUGIN_KEY: devices install only signed plugins"
            exit 1
          fi
          key="$RUNNER_TEMP/plugin.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$PAPERPAW_PLUGIN_KEY" > "$key")
          tools/plugin-files/sign.sh dist/plugins target/release/paperpaw-sign --key "$key"
      - name: Sign the update and the flash image with the firmware's key
        env:
          PAPERPAW_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.PAPERPAW_SIGNING_KEY || env.PAPERPAW_SIGNING_KEY }}
        run: |
          if [[ -z "$PAPERPAW_SIGNING_KEY" ]]; then
            echo "::error::no PAPERPAW_SIGNING_KEY: devices install only signed updates"
            exit 1
          fi
          # The plugins built in, which updates compare: the release fails
          # if the image does not list them.
          cargo run --release -p paperpaw-sign -- plugins \
            "dist/paperpaw-$DEVICE-$VERSION-install.bin" > "dist/paperpaw-$DEVICE-$VERSION-plugins.txt"
          cargo run --release -p paperpaw-sign -- sign \
            "dist/paperpaw-$DEVICE-$VERSION-install.bin" "dist/paperpaw-$DEVICE-$VERSION-update.bin"
          # Devices install only updates for their own chip.
          shown="$(cargo run -q --release -p paperpaw-sign -- show "dist/paperpaw-$DEVICE-$VERSION-update.bin")"
          echo "$shown"
          if ! grep -Eq "^chip: +$FIRMWARE_CHIP_ID\$" <<< "$shown"; then
            echo "::error::the update for the $DEVICE is not for chip $FIRMWARE_CHIP_ID"
            exit 1
          fi
          # The web flasher checks the whole image against this.
          cargo run --release -p paperpaw-sign -- sign-apart \
            "dist/paperpaw-$DEVICE-$VERSION.bin" "dist/paperpaw-$DEVICE-$VERSION.bin.sig"
          cd dist
          sha256sum "paperpaw-$DEVICE-$VERSION.bin" > "paperpaw-$DEVICE-$VERSION.bin.sha256"
          sha256sum "paperpaw-$DEVICE-$VERSION-update.bin" > "paperpaw-$DEVICE-$VERSION-update.bin.sha256"
          sha256sum "paperpaw-$DEVICE-$VERSION-install.bin" > "paperpaw-$DEVICE-$VERSION-install.bin.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.device }}
          path: dist/paperpaw-${{ matrix.device }}-*
      - uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ matrix.device }}
          path: dist/plugins/*.ppn
      # espup's toolchain is cached between runs (xteink-tools): the core
      # libraries installed into it go again, so that no run finds those
      # of another commit.
      - name: The core libraries out of the cached toolchain
        if: always() && matrix.device != 'x4' && matrix.device != 'x3'
        run: rm -rf "$(rustc +esp --print sysroot)/lib/rustlib/xtensa-esp32s3-none-elf"

  release:
    name: Release
    needs: [guard, android, xtensa-std, firmware, web, emulator, handbook]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One run at a time adds to the store release (store-plugin.yml has the
    # same group): two would choose and plan from the same list. A run waits
    # for the one before it (GitHub keeps one waiting run for a group; start
    # a run that was cancelled waiting again). Dry runs add nothing and wait
    # for no one.
    concurrency:
      group: ${{ github.event_name == 'push' && 'store-release' || format('store-release-dry-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: The version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      # The plugins' folders and their entries for the plugin library. A
      # plugin's version is published once (published.py): one that did
      # not change since a release keeps the bytes it was published with
      # where its firmware's fingerprint did not change either, and the
      # address of the release it was published in. What is new goes to the
      # store release of the year (store_release.py), which this run
      # chooses before it writes the catalogue, so that each address says
      # where its file will be.
      - name: The first-party plugins' folders and catalogue entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/plugins
          mv dist/*.ppn dist/plugins/
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python3 tools/plugin-files/published.py files dist/plugins "$RUNNER_TEMP/releases.json"
          # PaperPaw's own data plugins (data.toml): built here, their
          # folders and entries beside the plugins with code.
          python3 tools/plugin-files/data.py "$RUNNER_TEMP/data"
          store="$(python3 tools/plugin-files/store_release.py choose --releases "$RUNNER_TEMP/releases.json" \
            --year "$(date -u +%Y)" --dist dist/plugins --repo "$GITHUB_REPOSITORY")"
          echo "STORE_TAG=$store" >> "$GITHUB_ENV"
          echo "The store release: $store"
          python3 tools/plugin-files/catalogue.py dist/plugins "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$store" \
            --date "$(date -u +%F)" --data "$RUNNER_TEMP/data" --releases "$RUNNER_TEMP/releases.json"
          python3 tools/plugin-files/published.py folders dist/plugins "$RUNNER_TEMP/releases.json"
          (cd dist/plugins && zip -q -X -r "../paperpaw-$VERSION-catalogue.zip" catalogue)
          mv dist/plugins/SHA256SUMS "dist/paperpaw-$VERSION-plugins.sha256"
          python3 tools/plugin-files/store_release.py plan --releases "$RUNNER_TEMP/releases.json" \
            --tag "$store" --dist dist/plugins --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/store-plan.json"
      # A dry run signs with throw-away keys (the real ones are for a tag).
      - uses: ./.github/actions/dry-run-keys
      # The emulators, the handbook, the web emulator and the ESP32-S3's
      # core libraries: a checksum and a signature of their own each, with
      # the firmware's key (the workshop, plugin authors and paperpaw.org
      # pin its public key). The key is on the disk only while they are
      # signed.
      - name: Sign the emulators, font generator, handbook, web emulator and core libraries
        env:
          PAPERPAW_SIGNING_KEY: ${{ github.event_name == 'push' && secrets.PAPERPAW_SIGNING_KEY || env.PAPERPAW_SIGNING_KEY }}
        run: |
          if [[ -z "$PAPERPAW_SIGNING_KEY" ]]; then
            echo "::error::no PAPERPAW_SIGNING_KEY: the workshop takes only signed emulators"
            exit 1
          fi
          cargo build -q --release -p paperpaw-sign
          for file in dist/paperpaw-emu-"$VERSION"-*.zip dist/paperpaw-fontgen-"$VERSION"-*.zip \
            "dist/paperpaw-handbook-$VERSION.zip" \
            "dist/paperpaw-web-$VERSION.zip" "dist/paperpaw-xtensa-std-$VERSION.tar.gz"; do
            target/release/paperpaw-sign sign-asset "$file" "$file.sig"
            target/release/paperpaw-sign check-asset "$file" "$file.sig"
            (cd dist && sha256sum "$(basename "$file")" > "$(basename "$file").sha256")
          done
      - name: Release notes from CHANGELOG.md
        run: |
          # The section of this version, up to the next one.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      # Before anything is uploaded: the release holds exactly its 73 files
      # and no plugin file, and every address in the catalogue has an asset,
      # in the store release's plan or in a release that has it already.
      - name: The lists are right
        run: |
          python3 tools/plugin-files/release_assets.py check --dist dist --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" --plan "$RUNNER_TEMP/store-plan.json" \
            --releases "$RUNNER_TEMP/releases.json"
          python3 tools/plugin-files/release_assets.py names "$VERSION" > dist/assets.txt
      # Plugin files first: the firmware release holds a catalogue whose
      # addresses must exist when paperpaw.org reads it. A run that fails
      # after this leaves files that the next run takes as published (the
      # same version and firmware, the same bytes).
      - name: Add the new plugin files to the store release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$DRY_RUN" == true ]]; then
            {
              echo "### Dry run: the store release $STORE_TAG"
              echo '```'
              python3 tools/plugin-files/store_release.py upload --plan "$RUNNER_TEMP/store-plan.json" --dry-run
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/plugin-files/store_release.py upload --plan "$RUNNER_TEMP/store-plan.json"
          fi
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PaperPaw's own releases, betas too, are GitHub's "latest": what
          # firmware directories (readme.club) read; a beta says so in its
          # version. The store release is a pre-release that is never the
          # latest (store_release.py). The files are those of
          # release_assets.py: the firmware's, the emulators', the
          # handbook's, the web emulator's, the core libraries', and the
          # catalogue with its checksums; the X4 Classic's and the X3's are
          # experimental (not yet tried on one).
          assets=()
          while read -r name; do assets+=("dist/$name"); done < dist/assets.txt
          if [[ "$DRY_RUN" == true ]]; then
            {
              echo "### Dry run: the release $RELEASE_TAG (${#assets[@]} files)"
              echo '```'
              echo "gh release create $RELEASE_TAG --latest --title \"PaperPaw $VERSION\" --notes-file dist/notes.md <the files below>"
              printf '%s\n' "${assets[@]}"
              echo '```'
              echo "The store release: $STORE_TAG; the plan:"
              echo '```'
              python3 -c 'import json, sys; [print(i["name"], i["size"]) for i in json.load(open(sys.argv[1]))["files"]]' \
                "$RUNNER_TEMP/store-plan.json"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$RELEASE_TAG" --latest \
              --title "PaperPaw $VERSION" --notes-file dist/notes.md "${assets[@]}"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && env.DRY_RUN == 'true'
        with:
          name: dry-run-lists
          path: |
            dist/assets.txt
            ${{ runner.temp }}/store-plan.json
