name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The firmware is a crate of its own, outside the workspace.
      - run: rustfmt --edition 2024 --check shells/xteink/src/main.rs
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: API documentation without broken links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Builds without runtime font rendering use bitmap font packs.
      - run: cargo test -p paperpaw-text -p paperpaw-plugin-fonts-default --no-default-features

  msrv:
    name: Oldest Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The workspace's `rust-version`; `+1.88` wins over
      # rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-targets

  sdk:
    name: SDK compatibility
    runs-on: ubuntu-latest
    env:
      # rustdoc's JSON output, for the API file; pinned so that it reads
      # the same on every machine.
      NIGHTLY: nightly-2026-10-17
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install "$NIGHTLY" --profile minimal
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@0.51.0,cargo-public-api@0.52.0
      - name: No change that breaks plugins unless the version says so
        # Against each crate's last release on crates.io; a crate joins
        # once it has one.
        run: |
          packages=()
          for crate in paperpaw-sdk paperpaw-platform paperpaw-graphics paperpaw-i18n \
            paperpaw-config paperpaw-text paperpaw-document paperpaw-layout paperpaw-xml \
            paperpaw-zip paperpaw-hyphen paperpaw-image paperpaw-update paperpaw-digest \
            paperpaw-json paperpaw-qr paperpaw-sqlite; do
            if curl -sfo /dev/null "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate"; then
              packages+=(-p "$crate")
            else
              echo "$crate: not released yet"
            fi
          done
          cargo semver-checks "${packages[@]}"
      - name: The SDK's public API, and that of the crates it passes on, is each crate's api.txt
        run: |
          for crate in paperpaw-sdk paperpaw-config paperpaw-document paperpaw-layout \
            paperpaw-xml paperpaw-image paperpaw-hyphen paperpaw-zip paperpaw-json paperpaw-digest; do
            cargo "+$NIGHTLY" public-api -p "$crate" -sss > api.txt
            diff -u "crates/$crate/api.txt" api.txt
          done

  embedded:
    name: no_std targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [riscv32imc-unknown-none-elf, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel and first-party plugins
        # The standard app pulls in every first-party plugin, so a new
        # one is built here without being listed.
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p paperpaw-app --no-default-features --features packs,store-plugins,diagnostics
          -p paperpaw-image -p paperpaw-sqlite -p paperpaw-stardict
          -p paperpaw-sample-hello -p paperpaw-x4 -p paperpaw-fat
      - name: Lint the web emulator
        # The emulator's device model and paperpaw-dev's checks, with std,
        # in a browser (shells/web); its exports exist on wasm32 only.
        if: matrix.target == 'wasm32-unknown-unknown'
        run: cargo clippy --target wasm32-unknown-unknown -p paperpaw-web -- -D warnings
      - name: Build the web emulator
        # As it is served, its size told and kept in bounds.
        if: matrix.target == 'wasm32-unknown-unknown'
        run: python3 shells/web/build.py --limit-mb 14

  firmware:
    name: Firmware (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The X4 (ESP32-C3), the X4 Pro and the X4 Classic (ESP32-S3).
        device: [x4, x4-pro, x4-classic]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/xteink-tools
        with:
          device: ${{ matrix.device }}
      - uses: Swatinem/rust-cache@v2
        with:
          # The firmware, the sample code plugin and paperpaw-sign.
          workspaces: |
            shells/xteink
            samples/hello-native
            .
          key: ${{ matrix.device }}
      - name: Lint and build
        working-directory: shells/xteink
        # Linted with remote control over USB, as for testing, and
        # without, as released; built as released.
        run: |
          cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE,remote" -- -D warnings
          cargo +"$FIRMWARE_TOOLCHAIN" clippy $FIRMWARE_CARGO --features "$DEVICE" -- -D warnings
          cargo +"$FIRMWARE_TOOLCHAIN" build $FIRMWARE_CARGO --features "$DEVICE"
      - name: The sample code plugin fits the firmware
        id: native
        uses: ./.github/actions/native-sample
      # PaperPaw's own plugins that the store offers, as the release
      # builds them (unsigned here): each packs, for this chip, with the
      # firmware's fingerprint.
      # Signed with a key made for this run, and their catalogue entries
      # made, as the release does.
      - name: The store's first-party plugins fit the firmware
        env:
          FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: |
          out="$RUNNER_TEMP/plugins"
          tools/plugin-files/build.sh "$DEVICE" "$out" --fingerprint "$FINGERPRINT"
          cargo build -q --release -p paperpaw-sign
          target/release/paperpaw-sign key "$RUNNER_TEMP/ci.key" > /dev/null
          tools/plugin-files/sign.sh "$out" target/release/paperpaw-sign --key "$RUNNER_TEMP/ci.key"
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          python3 tools/plugin-files/catalogue.py "$out" "$version" https://example.invalid/ci

  native:
    name: Native plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/paperpaw-core/tests/native-plugin
      - name: A plugin from another workspace, in a kernel
        run: |
          cargo build --release --manifest-path crates/paperpaw-core/tests/native-plugin/Cargo.toml
          cargo test -p paperpaw-core --test native_plugin -- --ignored
      - name: The SDK keeps no mutable statics
        # A plugin file has no writable data, and a plugin has its own
        # copy of the SDK code it uses. Without LTO, each crate's objects
        # are seen apart.
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo build --release --target riscv32imc-unknown-none-elf -p paperpaw-sdk --target-dir target/statics
          cargo run --release -p paperpaw-sign -- statics \
            target/statics/riscv32imc-unknown-none-elf/release/deps/*.rlib
      - name: The sample and its CI template name the firmware's compilers
        run: |
          x4="$(sed -n 's/^channel = "\(.*\)"/\1/p' shells/xteink/rust-toolchain.toml)"
          . shells/xteink/versions.env
          template=samples/hello-native/.github/workflows/build.yml
          status=0
          for found in \
            "samples/hello-native/rust-toolchain.toml:channel = \"$x4\"" \
            "$template:RUST_X4: \"$x4\"" \
            "$template:RUST_X4_PRO: \"$ESP_RUST_VERSION\"" \
            "$template:ESP_GCC: \"$ESP_GCC_VERSION\""; do
            if ! grep -qF -- "${found#*:}" "${found%%:*}"; then
              echo "::error file=${found%%:*}::should say ${found#*:}, as shells/xteink does"
              status=1
            fi
          done
          exit $status

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Plugins depend on the SDK only
        # Their tests may run them in a kernel (dev-dependencies).
        run: |
          status=0
          for manifest in plugins/*/Cargo.toml samples/*/Cargo.toml; do
            if awk '/^\[/ { part = $0 } part == "[dependencies]" && /^paperpaw-core/' "$manifest" | grep -q .; then
              echo "::error file=$manifest::plugins must depend on paperpaw-sdk, not paperpaw-core"
              status=1
            fi
          done
          exit $status
      - name: The store's first-party folders carry How it works
        run: python3 -m unittest discover -s tools/plugin-files
      - name: The handbook holds the SDK and PaperPaw's own plugins, without tests
        run: python3 -m unittest discover -s tools -p "test_handbook.py"
      - name: Android takes each beta over the one before, and the release over its betas
        run: |
          for pair in "0.4.0-dev 40000" "0.5.0-beta.1 50001" "0.5.0-beta.2 50002"               "0.5.0-beta.10 50010" "0.5.0 50099" "0.5.1-beta.1 50101"; do
            set -- $pair
            got="$(shells/android/version-code.sh "$1")"
            [[ "$got" == "$2" ]] || { echo "::error::$1 has version code $got, not $2"; exit 1; }
          done

  emulator:
    name: Emulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p paperpaw-emulator
      - name: Headless smoke test on every profile
        shell: bash
        run: |
          emu="cargo run -q -p paperpaw-emulator --"
          for profile in $($emu --list-profiles | cut -d' ' -f1); do
            $emu --headless --profile "$profile" --script "wait:600" --screenshot "out/$profile.png"
          done
          # Open a sample book from the library and read a few pages.
          $emu --headless --profile xteink-x4 \
            --script "confirm,right,confirm,page-forward,page-forward,page-back,wait:2000" \
            --screenshot out/xteink-x4-reading.png
          # An EPUB within the X4 heap budget: contents, jump to chapter II.
          $emu --headless --profile xteink-x4 \
            --set reader.open-last=off --set slots.core.home=files.browser \
            --script "confirm,wait:500,confirm,confirm,right,right,right,right,confirm,wait:300" \
            --screenshot out/xteink-x4-epub-chapter.png
          $emu --headless --profile kobo-clara-bw --set core.language=de \
            --script "tap:500:480,tap:500:190,swipe:900:700:100:700,tap:100:700,long-tap:500:700" \
            --screenshot out/kobo-clara-bw-reading.png
          # Reader menu (long confirm), larger text, settings screen.
          $emu --headless --profile xteink-x4 --script "long:confirm,confirm,wait:300" \
            --screenshot out/xteink-x4-larger-text.png
          $emu --headless --profile xteink-x4 \
            --script "long:confirm,right,right,right,right,right,confirm,right,confirm" \
            --screenshot out/xteink-x4-settings.png
          # Only two buttons: open a book, the menu and the settings, edit a value.
          $emu --headless --profile two-buttons \
            --script "long:page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward,page-forward,page-forward,page-forward,page-forward,long:page-forward,page-forward,long:page-forward,page-forward" \
            --screenshot out/two-buttons-settings.png
          $emu --headless --profile boox-go-7 --set slots.core.home=diagnostics.screen \
            --script "page-forward,long-tap:600:800"
          # What a release hands the workshop: the registry, --stdio, the
          # handbook.
          $emu --registry out/registry.json
          printf '%s\n' '{"op": "quit"}' | $emu --stdio | grep -q '"event": "ready"'
          py="$(command -v python3 || command -v python)"
          "$py" tools/handbook.py out/registry.json ci out/handbook.zip
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: emulator-screenshots
          path: out/*.png

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-ndk --locked
      # The runner's variables are not in the `env` context, so the NDK
      # path is passed on through GITHUB_ENV.
      - name: Find the NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}" >> "$GITHUB_ENV"
      - name: Lint the Android shell
        run: cargo ndk -t arm64-v8a --platform 26 clippy -p paperpaw-android
      - name: Build the APK
        run: shells/android/build-apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: paperpaw-android-apk
          path: target/android/paperpaw.apk

  fuzz:
    name: Fuzz parsers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: One minute per target, seeded with the sample books
        run: |
          mkdir -p fuzz/corpus/epub fuzz/corpus/txt
          cp samples/library/books/*.epub fuzz/corpus/epub/
          cp samples/library/books/*.txt fuzz/corpus/txt/
          mkdir -p fuzz/corpus/image
          cp crates/paperpaw-image/tests/data/*.jpg crates/paperpaw-image/tests/data/*.png fuzz/corpus/image/
          # `+nightly` overrides rust-toolchain.toml, which pins stable.
          for target in epub txt xml hyphen image lua; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60 -rss_limit_mb=1024
          done
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts

  deny:
    name: Licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      # The firmware pins its own compiler (rust-toolchain.toml), which the
      # action's container cannot install: cargo-deny runs on the runner.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: The X4 firmware's dependencies too
        run: cargo deny --manifest-path shells/xteink/Cargo.toml --all-features check
