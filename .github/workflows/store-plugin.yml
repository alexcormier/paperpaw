name: Store plugin update

# One of PaperPaw's own store plugins, updated between releases, for the
# firmware of a release already out (`base`): built at `ref` (a branch
# from the base's tag with the fix, the plugin's crate at a newer
# version of its own), checked against the base firmware's fingerprint,
# signed with the first-party plugin key, and released as a pre-release
# tagged `<id>-v<version>` with the plugin's files and its catalogue
# entry alone (`paperpaw-<id>-v<version>-catalogue.zip`). paperpaw.org
# imports it as it imports a release, adding the version to that
# plugin's entry; with no firmware in it, devices are offered no update
# of their own. The next release builds the plugin again, at the version
# it has then, for its own firmware.
#
# One of PaperPaw's own data plugins (tools/plugin-files/data.toml, no
# code) takes the same path: its version is data.toml's, newer than the
# base's; its builder makes its folder, nothing is built for a device or
# signed, and the release holds its folder's ZIP and its entry alone.
#
# A code plugin the base does not have (a new one, first published between
# releases) takes the same path with the version its manifest has. Its
# source must be made from the base's tag, and differ from it only in the
# plugin, its tooling (tools/plugin-files), the CHANGELOG and docs, unless
# `accept` names the rest: the published firmware is the base's, so a change
# to the kernel, the SDK, the shells or another plugin is not in it
# (store_update.py). The plugin file must have the base firmware's
# fingerprint, which build.sh and, before the signing, check_files.sh check.
#
# The source (`ref`) is a branch somebody pushed, so its code never meets
# the key or a token that can write. The jobs that hold either (the check,
# the signing, the release) run this workflow's own scripts, from a
# checkout of `github.workflow_sha` (run the workflow from main): the check
# and the fingerprint test (store_update.py, check_files.sh) and the signing
# (sign.sh, paperpaw-sign built there). The jobs that run the source's code
# (building the plugin, its catalogue entry) have a token that only reads
# and no secret. The one hand-over is the files: the signing job takes the
# build's files, accepts only the names and the base firmware's fingerprint
# it expects, and signs them.
#
# The release is made with this workflow's token, and release.yml runs
# only for tags of PaperPaw's versions, so nothing else starts with it.
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin's id (tools/plugin-files/plugins.txt or data.toml)
        required: true
      base:
        description: The release whose firmware it is for (e.g. v0.5.0-beta.2)
        required: true
      ref:
        description: The branch or commit with the fix, from the base's tag
        required: true
      notes:
        description: What the update changes, one line for the release notes
        required: true
      accept:
        description: >-
          Paths or folders outside the plugin that differ from the base's tag and
          may (comma separated, e.g. plugins/format-epub); anything else that
          differs stops the run
        required: false
        default: ""

# Only the release job writes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PLUGIN: ${{ inputs.plugin }}
  BASE: ${{ inputs.base }}
  ACCEPT: ${{ inputs.accept }}

jobs:
  check:
    name: Version and source
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
      kind: ${{ steps.source.outputs.kind }}
    steps:
      # This workflow's own scripts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
      # The source to publish: data to the scripts, never run by them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - name: The source is the base's, the plugin at a newer version
        id: source
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trusted="$GITHUB_WORKSPACE/trusted"
          workspace="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          if [[ "v$workspace" != "$BASE" ]]; then
            echo "::error::the source is PaperPaw $workspace, not $BASE: make the fix from the base's tag"
            exit 1
          fi
          if sed -e 's/#.*//' tools/plugin-files/plugins.txt | awk 'NF { print $1 }' | grep -qx "$PLUGIN"; then
            kind=code
          elif [[ -f tools/plugin-files/data.toml ]] \
            && python3 -c 'import sys, tomllib; sys.exit(sys.argv[1] not in tomllib.load(open("tools/plugin-files/data.toml", "rb")))' "$PLUGIN"; then
            kind=data
          else
            echo "::error::$PLUGIN is not in tools/plugin-files/plugins.txt or data.toml"
            exit 1
          fi
          if [[ "$kind" == data ]]; then
            # Its version in data.toml, newer than the base's. (A data
            # plugin has no signature and no code of its own on a device;
            # the source's script reads it, with no key and a read-only token.)
            version="$(python3 tools/plugin-files/data.py --newer "$PLUGIN" "$BASE" 2>&1)" \
              || { echo "::error::$version"; exit 1; }
          else
            # Its own version, as its manifest says it, newer than the base's
            # (any, for a plugin the base does not have); the source made from
            # the base's tag and differing only in the plugin and its project,
            # or in what `accept` names. This workflow's script, not the source's.
            version="$(python3 -I "$trusted/tools/plugin-files/store_update.py" "$PLUGIN" "$BASE" \
              --source "$PWD" --accept "$ACCEPT")" || exit 1
          fi
          tag="$PLUGIN-v$version"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || git -C "$trusted" ls-remote --exit-code --tags origin "$tag" > /dev/null; then
            echo "::error::$tag exists already"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  plugin:
    name: Plugin (${{ matrix.device }})
    needs: [check]
    # The source's code runs here (its build): no secret, a token that reads.
    # A data plugin has nothing to build for a device.
    if: needs.check.outputs.kind == 'code'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The devices the base release has firmware for.
        device: [x4, x4-pro, x4-classic]
    env:
      DEVICE: ${{ matrix.device }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      # The base's toolchain (its actions), its core libraries and its
      # firmware's fingerprint, so its firmware loads the plugin.
      - uses: ./.github/actions/xteink-tools
        with:
          device: ${{ matrix.device }}
      - name: The base release's fingerprint and core libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="${BASE#v}"
          dir="$RUNNER_TEMP/base"
          # The X4 Classic has the X4 Pro's chip: its plugins are the
          # Pro's, fingerprint and all, and a release names the Pro's only.
          abi="$DEVICE"
          [[ "$DEVICE" == x4-classic ]] && abi=x4-pro
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -D "$dir" -p "paperpaw-$abi-$base-abi.txt"
          echo "FINGERPRINT=$(awk 'NR == 1 { print $1 }' "$dir/paperpaw-$abi-$base-abi.txt")" >> "$GITHUB_ENV"
          if [[ "$DEVICE" != x4 ]]; then
            gh release download "$BASE" -R "$GITHUB_REPOSITORY" -D "$dir" \
              -p "paperpaw-xtensa-std-$base.tar.gz" -p "paperpaw-xtensa-std-$base.tar.gz.sha256"
            (cd "$dir" && sha256sum -c "paperpaw-xtensa-std-$base.tar.gz.sha256")
            echo "XTENSA_STD=$dir/paperpaw-xtensa-std-$base.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: ./.github/actions/xtensa-std
        if: matrix.device != 'x4'
        with:
          archive: ${{ env.XTENSA_STD }}
      - name: Build it
        run: |
          # The source's script; the signing job checks the files again.
          tools/plugin-files/build.sh "$DEVICE" dist/plugins --fingerprint "$FINGERPRINT" --only "$PLUGIN"
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-${{ matrix.device }}
          path: dist/plugins/*.ppn
      - name: The core libraries out of the cached toolchain
        if: always() && matrix.device != 'x4'
        run: rm -rf "$(rustc +esp --print sysroot)/lib/rustlib/xtensa-esp32s3-none-elf"

  sign:
    name: Sign
    needs: [check, plugin]
    if: needs.check.outputs.kind == 'code'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      # Nothing of the source here: this workflow's own checkout builds the
      # signing tool, checks the build's files and signs them (audit O-17:
      # the key is on the disk only while the files are signed).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: unsigned-*
          path: dist/unsigned
      - name: Each file is the one expected, for the base firmware
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release's compiler (rust-toolchain.toml), for the tool alone.
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          cargo build -q --release -p paperpaw-sign
          base="${BASE#v}"
          for device in x4 x4-pro x4-classic; do
            # The X4 Classic has the X4 Pro's chip: its plugins are the
            # Pro's, fingerprint and all, and a release names the Pro's only.
            abi="$device" chip=9
            [[ "$device" == x4 ]] && chip=5
            [[ "$device" == x4-classic ]] && abi=x4-pro
            dir="$RUNNER_TEMP/abi-$device"
            gh release download "$BASE" -R "$GITHUB_REPOSITORY" -D "$dir" -p "paperpaw-$abi-$base-abi.txt"
            fingerprint="$(awk 'NR == 1 { print $1 }' "$dir/paperpaw-$abi-$base-abi.txt")"
            tools/plugin-files/check_files.sh "dist/unsigned/unsigned-$device" target/release/paperpaw-sign \
              "$chip" "$fingerprint" "$PLUGIN-$VERSION-$device.ppn"
          done
      - name: Sign them with the first-party plugin key
        env:
          PAPERPAW_PLUGIN_KEY: ${{ secrets.PAPERPAW_PLUGIN_KEY }}
        run: |
          if [[ -z "$PAPERPAW_PLUGIN_KEY" ]]; then
            echo "::error::no PAPERPAW_PLUGIN_KEY: devices install only signed plugins"
            exit 1
          fi
          key="$RUNNER_TEMP/plugin.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$PAPERPAW_PLUGIN_KEY" > "$key")
          for dir in dist/unsigned/unsigned-*; do
            tools/plugin-files/sign.sh "$dir" target/release/paperpaw-sign --key "$key"
          done
      - name: Collect them
        run: |
          mkdir -p dist/signed
          cp dist/unsigned/unsigned-*/*.ppn dist/signed/
      - uses: actions/upload-artifact@v7
        with:
          name: signed
          path: dist/signed/*.ppn

  catalogue:
    name: Catalogue entry
    needs: [check, sign]
    # After the signed files, or with none for a data plugin.
    if: >-
      always() && needs.check.result == 'success'
      && (needs.sign.result == 'success' || needs.check.outputs.kind == 'data')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      KIND: ${{ needs.check.outputs.kind }}
    steps:
      # The source's scripts run here (its folder and entry): no secret, a
      # token that reads. The release job takes only their ZIPs and sums.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.kind == 'code'
        with:
          name: signed
          path: dist/plugins
      - name: Its folder and catalogue entry
        run: |
          tag="$PLUGIN-v$VERSION"
          mkdir -p dist/plugins dist/out
          data=()
          if [[ "$KIND" == data ]]; then
            python3 tools/plugin-files/data.py "$RUNNER_TEMP/data" --only "$PLUGIN"
            data=(--data "$RUNNER_TEMP/data")
          fi
          python3 tools/plugin-files/catalogue.py dist/plugins "${BASE#v}" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag" \
            --date "$(date -u +%F)" --only "$PLUGIN" --tag "$tag" "${data[@]}"
          (cd dist/plugins && zip -q -X -r "../out/paperpaw-$tag-catalogue.zip" catalogue)
          mv dist/plugins/SHA256SUMS "dist/out/paperpaw-$tag-plugins.sha256"
          # A data plugin's folder, zipped; for a code plugin, none.
          shopt -s nullglob
          for zip in dist/plugins/*.zip; do cp "$zip" dist/out/; done
      - uses: actions/upload-artifact@v7
        with:
          name: catalogue
          path: |
            dist/out/*.zip
            dist/out/*.sha256

  release:
    name: Release
    needs: [check, sign, catalogue]
    if: >-
      always() && needs.check.result == 'success' && needs.catalogue.result == 'success'
      && (needs.sign.result == 'success' || needs.check.outputs.kind == 'data')
    runs-on: ubuntu-latest
    # The only job that writes, and it runs none of the source's code: it
    # takes the signed files and the catalogue's ZIPs and sums, and makes
    # the release.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      KIND: ${{ needs.check.outputs.kind }}
    steps:
      - uses: actions/download-artifact@v8
        if: needs.check.outputs.kind == 'code'
        with:
          name: signed
          path: dist/signed
      - uses: actions/download-artifact@v8
        with:
          name: catalogue
          path: dist/out
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.check.outputs.commit }}
          NOTES: ${{ inputs.notes }}
        run: |
          tag="$PLUGIN-v$VERSION"
          shopt -s nullglob
          signed=(dist/signed/*.ppn)
          if [[ "$KIND" == code ]]; then
            for device in x4 x4-pro x4-classic; do
              [[ -f "dist/signed/$PLUGIN-$VERSION-$device.ppn" ]] || { echo "::error::no signed file for $device"; exit 1; }
            done
            [[ ${#signed[@]} -eq 3 ]] || { echo "::error::expected three signed files, found ${#signed[@]}"; exit 1; }
          fi
          {
            echo "$PLUGIN $VERSION, this plugin alone (an update, or a new plugin between releases), for PaperPaw ${BASE#v}."
            echo
            echo "- $NOTES"
          } > dist/notes.md
          # A data plugin has its folder's ZIP alone, no files for devices.
          files=("${signed[@]}" dist/out/*.zip dist/out/*.sha256)
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$COMMIT" \
            --prerelease --latest=false --title "$PLUGIN $VERSION" --notes-file dist/notes.md \
            "${files[@]}"
