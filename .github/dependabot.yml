version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Pinned on purpose: the oldest Rust PaperPaw supports (MSRV).
      - dependency-name: dtolnay/rust-toolchain
