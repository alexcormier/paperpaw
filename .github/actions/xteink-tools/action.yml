name: Xteink tools
description: >
  The toolchain one device's firmware is built with (shells/xteink:
  rust-toolchain.toml for the X4, espup's `esp` toolchain of versions.env
  for the X4 Pro and the X4 Classic), and espflash if asked. Sets
  FIRMWARE_TOOLCHAIN, FIRMWARE_TARGET, FIRMWARE_CHIP (as espflash names
  it), FIRMWARE_CHIP_ID (as images do), FIRMWARE_CARGO (the arguments
  every build takes, the features left to add) and PLUGIN_ALIAS (the
  alias code plugins build with, as samples/hello-native names it; for
  the ESP32-S3 after the action xtensa-std).
inputs:
  device:
    description: x4, x3, x4-pro or x4-classic.
    required: true
  espflash:
    description: Whether to install espflash too.
    default: "false"
runs:
  using: composite
  steps:
    - name: The versions
      shell: bash
      run: grep -E '^[A-Z_]+=' shells/xteink/versions.env >> "$GITHUB_ENV"
    - name: What builds mbedTLS
      shell: bash
      run: |
        # CMake and Ninja for every device; clang compiles it for the X4
        # (the ESP32-S3's with espup's Xtensa GCC).
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build "$MBEDTLS_CLANG_PACKAGE"
        {
          echo "CMAKE_GENERATOR=Ninja"
          echo "CLANG_PATH=$(command -v "$MBEDTLS_CLANG_PACKAGE")"
        } >> "$GITHUB_ENV"
    # The X4's and the X3's (their chip, the ESP32-C3).
    - name: The X4's Rust
      if: inputs.device == 'x4' || inputs.device == 'x3'
      shell: bash
      run: |
        toolchain="$(sed -n 's/^channel = "\(.*\)"/\1/p' shells/xteink/rust-toolchain.toml)"
        target=riscv32imc-unknown-none-elf
        rustup toolchain install "$toolchain" --profile minimal --component clippy --target "$target"
        {
          echo "FIRMWARE_TOOLCHAIN=$toolchain"
          echo "FIRMWARE_TARGET=$target"
          echo "FIRMWARE_CHIP=esp32c3"
          echo "FIRMWARE_CHIP_ID=5"
          echo "FIRMWARE_CARGO=--release --target $target --no-default-features"
          echo "PLUGIN_ALIAS=x4"
        } >> "$GITHUB_ENV"
    - name: espup's toolchain, kept between runs
      id: esp-cache
      if: inputs.device != 'x4' && inputs.device != 'x3'
      uses: actions/cache@v4
      with:
        path: |
          ~/.rustup/toolchains/esp
          ~/export-esp.sh
        key: esp-${{ runner.os }}-${{ env.ESP_RUST_VERSION }}-${{ env.ESP_GCC_VERSION }}-${{ env.ESPUP_VERSION }}
    - name: espup's toolchain
      if: inputs.device != 'x4' && inputs.device != 'x3' && steps.esp-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cargo install espup --version "$ESPUP_VERSION" --locked
        espup install --targets esp32s3 --toolchain-version "$ESP_RUST_VERSION" \
          --crosstool-toolchain-version "$ESP_GCC_VERSION" --export-file "$HOME/export-esp.sh"
    - name: The ESP32-S3's Rust
      if: inputs.device != 'x4' && inputs.device != 'x3'
      shell: bash
      run: |
        # What export-esp.sh adds to PATH (the Xtensa GCC, which links),
        # and libclang's place.
        before="$PATH"
        . "$HOME/export-esp.sh"
        echo "${PATH%"$before"}" | tr ':' '\n' | grep . >> "$GITHUB_PATH"
        echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
        # A toolchain kept from before must be the version named.
        rustc +esp --version | tee /dev/stderr | grep -qF "($ESP_RUST_VERSION)"
        target=xtensa-esp32s3-none-elf
        {
          echo "FIRMWARE_TOOLCHAIN=esp"
          echo "FIRMWARE_TARGET=$target"
          echo "FIRMWARE_CHIP=esp32s3"
          echo "FIRMWARE_CHIP_ID=9"
          # As the aliases in shells/xteink/.cargo/config.toml: the core
          # library is built for Xtensa here.
          echo "FIRMWARE_CARGO=--release --target $target --no-default-features -Zbuild-std=core,alloc"
          # Code plugins link with the release's core libraries instead.
          echo "PLUGIN_ALIAS=x4pro"
        } >> "$GITHUB_ENV"
    - name: espflash
      if: inputs.espflash == 'true'
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y libudev-dev
        cargo install espflash --version "$ESPFLASH_VERSION" --locked
