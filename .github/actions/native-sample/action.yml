name: Native sample
description: >
  Reads the firmware's native fingerprint (ADR 0024: the compiler, target
  and SDK it was built with) from its ELF file, then builds and packs the
  sample code plugin (samples/hello-native) for the same device as an
  author does, and checks that the file fits: the same fingerprint and
  chip. After xteink-tools, whose FIRMWARE_* it uses, and the firmware's
  build.
outputs:
  fingerprint:
    description: The firmware's fingerprint, 16 hexadecimal digits.
    value: ${{ steps.check.outputs.fingerprint }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      run: |
        fingerprint="$(cargo run -q --release -p paperpaw-sign -- fingerprint \
          "shells/xteink/target/$FIRMWARE_TARGET/release/paperpaw-xteink")"
        echo "the firmware's fingerprint: $fingerprint"
        echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
        # Linked as .cargo/config.toml's flags say, which RUSTFLAGS would
        # replace, with its alias for the chip.
        (cd samples/hello-native && env -u RUSTFLAGS \
          cargo +"$FIRMWARE_TOOLCHAIN" "$PLUGIN_ALIAS")
        ppn="$RUNNER_TEMP/hello-$FIRMWARE_CHIP.ppn"
        cargo run -q --release -p paperpaw-sign -- pack \
          "samples/hello-native/target/$FIRMWARE_TARGET/release/hello" "$ppn"
        shown="$(cargo run -q --release -p paperpaw-sign -- plugin "$ppn")"
        echo "$shown"
        if ! grep -Eq "^fingerprint: +$fingerprint\$" <<< "$shown" \
          || ! grep -Eq "^chip: .*\($FIRMWARE_CHIP_ID\)\$" <<< "$shown"; then
          echo "::error::the sample plugin does not fit the firmware (fingerprint $fingerprint, chip $FIRMWARE_CHIP_ID)"
          exit 1
        fi
