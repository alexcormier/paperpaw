[package]
name = "paperpaw-android"
description = "PaperPaw Android shell: a native activity for Android e-readers (Boox and others)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
# The library Android loads (`libpaperpaw.so`, see AndroidManifest.xml).
name = "paperpaw"
crate-type = ["cdylib", "rlib"]

[dependencies]
paperpaw-digest.workspace = true
paperpaw-app = { workspace = true, features = ["outline"] }
paperpaw-core = { workspace = true, features = ["color", "outline"] }
paperpaw-serve.workspace = true
paperpaw-fs.workspace = true
paperpaw-graphics = { workspace = true, features = ["color"] }
paperpaw-platform.workspace = true
paperpaw-sdk.workspace = true
# The system's random numbers, for keys (`KernelBuilder::random`).
getrandom = "0.4"
# Its setting's id, for the shared dictionaries folder.
paperpaw-plugin-dictionary.workspace = true
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = { version = "0.15", default-features = false }
jni = "0.21"
ndk = "0.9"

[lints]
workspace = true
