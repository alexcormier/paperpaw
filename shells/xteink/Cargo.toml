[package]
name = "paperpaw-xteink"
description = "PaperPaw's firmware for the Xteink X4 (ESP32-C3), X4 Pro and X4 Classic (ESP32-S3)"
# No version of its own: the firmware is PaperPaw's, whose version (the
# workspace's) `build.rs` gives it. Its Rust is the pinned one of
# `rust-toolchain.toml` and `versions.env`, not the workspace's.
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# A workspace of its own (the repository's leaves it out), found as such
# also in a checkout inside another one, such as a git worktree.
[workspace]

[[bin]]
name = "paperpaw-xteink"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["x4", "remote"]
# Which device: the X4 or the X3 (ESP32-C3, built with the Rust of
# `rust-toolchain.toml`; the X3 experimental, `cargo x3`), the X4 Pro or
# the X4 Classic (ESP32-S3, Xtensa: espup's `esp` toolchain of
# `versions.env`, `cargo +esp x4pro`, `cargo +esp x4classic`). Exactly
# one.
x4 = ["esp32c3"]
x3 = ["esp32c3"]
# What both ESP32-C3 devices build with; chosen by `x4` or `x3`, not by
# hand.
esp32c3 = [
    "esp-hal/esp32c3",
    "esp-alloc/esp32c3",
    "esp-backtrace/esp32c3",
    "esp-println/esp32c3",
    "esp-println/auto",
    "esp-bootloader-esp-idf/esp32c3",
    "esp-storage/esp32c3",
    "esp-radio/esp32c3",
    "esp-rtos/esp32c3",
]
x4-pro = ["esp32s3", "bluetooth"]
x4-classic = ["esp32s3"]
# What both ESP32-S3 devices build with; chosen by `x4-pro` or
# `x4-classic`, not by hand.
esp32s3 = [
    "esp-hal/esp32s3",
    # The SD card's own bus (SDMMC).
    "esp-hal/__sdmmc",
    "esp-alloc/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-println/jtag-serial",
    "esp-bootloader-esp-idf/esp32s3",
    "esp-storage/esp32s3",
    "esp-radio/esp32s3",
    "esp-rtos/esp32s3",
]
# Remote control over USB for testing on the device (`src/remote.rs`):
# files in and out, presses, the screen, profiling, the heap's peak
# (counted in esp-alloc's hooks, `src/peak.rs`). Not in released firmware:
# it costs flash and memory, and anyone with a cable could use it.
remote = [
    "esp-alloc/alloc-hooks",
    # The diagnostics screen, for bringing up devices.
    "paperpaw-app/diagnostics",
]
# The frame test built in (`samples/frame-test`, ADR 0030), for measuring
# frames a second, blits and the heap on the device: test builds only.
frame-test = ["dep:paperpaw-sample-frame-test"]
# Bluetooth Low Energy, included by x4-pro (`src/bluetooth.rs`, ADR 0027):
# trouble-host on esp-radio's controller, beside Wi-Fi. The radio stays
# off until requested; remotes remain manual by default while connected
# idle power is being measured. The controller's code takes internal
# RAM from the heap (`HEAP_SIZE`).
bluetooth = [
    "esp-radio/ble",
    "esp-radio/coex",
    "dep:trouble-host",
    "dep:bt-hci",
    "dep:embassy-futures",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-sync",
]

[dependencies]
paperpaw-app = { path = "../../crates/paperpaw-app", default-features = false, features = ["packs"] }
# The sample that runs in real time (ADR 0030), built in for measuring:
# feature `frame-test`, never in released firmware.
paperpaw-sample-frame-test = { path = "../../samples/frame-test", optional = true }
paperpaw-core = { path = "../../crates/paperpaw-core" }
paperpaw-sdk = { path = "../../crates/paperpaw-sdk", features = ["kernel"] }
paperpaw-platform = { path = "../../crates/paperpaw-platform" }
paperpaw-graphics = { path = "../../crates/paperpaw-graphics" }
paperpaw-x4 = { path = "../../crates/paperpaw-x4" }
paperpaw-fat = { path = "../../crates/paperpaw-fat" }
paperpaw-http = { path = "../../crates/paperpaw-http" }
# A file's MD5 over USB (`remote`), to check what came; native plugins'
# SHA-256.
paperpaw-digest = { path = "../../crates/paperpaw-digest" }
# Native code plugins' files (`src/native`).
paperpaw-native = { path = "../../crates/paperpaw-native" }
# Its settings' ids, for the X4's defaults.
paperpaw-plugin-wifi = { path = "../../plugins/wifi" }
esp-hal = { version = "1.2", features = ["unstable"] }
esp-alloc = "0.11"
esp-backtrace = { version = "0.20", features = ["println"] }
# The log over USB: the X4 picks USB or its UART by itself, the X4 Pro
# always USB (choosing by the USB frames lost parts of lines there).
esp-println = { version = "0.18", default-features = false, features = ["log-04", "critical-section", "colors"] }
esp-bootloader-esp-idf = "0.6"
# The flash, for updates (`src/ota.rs`); with interrupts held while it is
# written, as code runs from it.
esp-storage = { version = "0.10", features = ["critical-section"] }
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
log = "0.4"
nb = "1"
critical-section = "1.2"
# Wi-Fi: the radio's driver is a beta of its 1.0, pinned to the version
# tried; only `src/wifi.rs` uses it.
esp-radio = { version = "=1.0.0-beta.1", features = ["wifi", "unstable", "esp-alloc"] }
esp-rtos = { version = "0.4", features = ["esp-radio", "esp-alloc"] }
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "proto-dhcpv4", "proto-dns", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-dns", "alloc"] }
embassy-net-driver = "0.2"
# Bluetooth (feature `bluetooth`): trouble-host's 0.7 is the one on
# esp-radio's bt-hci 0.9. Central and GATT client with pairing; the
# peripheral side comes with advertising (ADR 0027, step 4).
trouble-host = { version = "0.7", default-features = false, features = ["central", "scan", "gatt", "security", "log", "gatt-client-notification-queue-size-4"], optional = true }
bt-hci = { version = "0.9", optional = true }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
# Its clock, ours (`src/bluetooth.rs`): no executor.
embassy-time-driver = { version = "0.2", optional = true }
embassy-sync = { version = "0.8", optional = true }
# mbedTLS, built here (cmake, Ninja and a C compiler: clang for the X4,
# espup's GCC for the ESP32-S3 below) with what PaperPaw's HTTPS client
# uses alone, and 4 KB for the records it sends (requests, small
# uploads) instead of 16: 12 KB less for each secure connection, where
# the X4's memory is tightest. Records received stay 16 KB, as servers
# send them that large.
mbedtls-rs = { version = "0.3", default-features = false, features = [
    "tls-client", "tls-core", "tls-proto-tls12", "tls-proto-tls13",
    "x509-parse", "pk", "drbg-ctr", "entropy",
    "alg-rsa", "alg-rsa-pss", "alg-ecp", "alg-ecdh", "alg-ecdsa",
    "curve-secp256r1", "curve-secp384r1", "curve-secp521r1", "curve-curve25519",
    "alg-aes", "alg-gcm", "alg-chacha20", "alg-chachapoly", "cipher-mode-cbc",
    "alg-sha1", "alg-sha256", "alg-sha512", "alg-hkdf",
    "kex-ecdhe-ecdsa", "kex-ecdhe-rsa", "kex-rsa",
    "ssl-in-content-len-16384", "ssl-out-content-len-4096",
] }
webpki-roots = "1"
rand_core = "0.10"

# The ESP32-S3's mbedTLS is built with espup's Xtensa GCC.
[target.'cfg(target_arch = "xtensa")'.dependencies]
mbedtls-rs = { version = "0.3", default-features = false, features = ["use-gcc"] }

[build-dependencies]
# The list of the plugins built in, written as updates read it.
paperpaw-update = { path = "../../crates/paperpaw-update" }
# This firmware's compiler, as plugin files name theirs.
paperpaw-native = { path = "../../crates/paperpaw-native" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
# As in the workspace: panics are visible in review.
unwrap_used = "warn"
expect_used = "warn"

# The radio's code needs optimising for speed (Espressif: otherwise Wi-Fi
# may fail to connect).
[profile.release.package.esp-radio]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2

# rust-fatfs as the workspace patches it (patches/fatfs, "Modified for
# PaperPaw"): a removed file's entry goes before its clusters, and a new
# entry is written before the old one goes (rename, `Dir::replace`).
[patch."https://github.com/rafalh/rust-fatfs"]
fatfs = { path = "../../patches/fatfs" }

# trouble-host (feature `bluetooth`) stopped its whole host where the
# controller refused to switch address resolution on again after a sync
# of its list, because a scan or connection had begun meanwhile; this copy
# tries the sync again later (patches/trouble-host, "Modified for
# PaperPaw").
[patch.crates-io]
trouble-host = { path = "../../patches/trouble-host" }
