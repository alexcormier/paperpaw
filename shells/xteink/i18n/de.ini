[messages]
x4.button-response = Tastenreaktion
x4.button-response.help = Schneller reagiert früher und blättert am X4 Pro schneller, mit mehr Akku. Sparsam braucht weniger; ein sehr kurzes Antippen kann fehlen.
x4.button-response.normal = Normal
x4.button-response.faster = Schneller
x4.button-response.saving = Sparsam
x4.light-sleep = Leichtschlaf im Akkubetrieb
x4.light-sleep.help = Solange im Akkubetrieb nichts passiert, schläft der Prozessor zwischen den Tastenabfragen. Nur zum Vergleichsmessen ausschalten: Der Akku hält dann viel kürzer.
x4.frontlight = Frontlicht
x4.frontlight.help = Wie hell das Licht vor dem Bildschirm leuchtet; 0 ist aus. Im Ruhezustand geht es aus.
x4.warmth = Lichtfarbe
x4.warmth.help = Wie warm (gelblich) das Licht ist: 0 ist kühles Weiß, 100 ganz warm, am Abend angenehmer für die Augen.
x4.lab.title = Wellenform-Labor
x4.lab.waveform = Wellenform
x4.lab.waveform.panel = Die des Displays
x4.lab.waveform.temperature = Die des Displays, bei Temperatur
x4.lab.waveform.direct = Direkte Ansteuerung
x4.lab.temperature = Temperatur
x4.lab.frames = Frames
x4.lab.kick = Kick
x4.lab.picture = Bild
x4.lab.picture.stripes = Streifen
x4.lab.picture.squares = Quadrate
x4.lab.picture.halves = Hälften
x4.lab.picture.lines = Linien
x4.lab.auto = Von selbst wechseln
x4.lab.clean = Aufräumen
x4.lab.previous = Letztes Bild
x4.lab.flips = Wechsel
x4.lab.none = Noch kein Bild
x4.lab.help = Hoch/runter: Zeile. Links/rechts: ändern. Auswahl: wechseln.
x4.lab.clean-soon = Geisterbilder sammeln sich: bald aufräumen.
x4.lab.unsupported = Dieses Display kennt keine anderen Wellenformen; das Labor ist für das X4.
x4.fast-refresh = Schnelle Änderungen
x4.fast-refresh.help = Wie Menüs und ein verschobener Fokus angezeigt werden. Die Art des Displays braucht etwa eine halbe Sekunde; die anderen sind schneller, lassen aber mehr Geisterbilder (schwache Spuren von vorher), die der nächste Seitenwechsel oder volle Refresh löscht.
x4.fast-refresh.panel = Die des Displays (am langsamsten, am saubersten)
x4.fast-refresh.clean = Schnell, wenig Geisterbilder
x4.fast-refresh.balanced = Schneller, etwas Geisterbilder
x4.fast-refresh.quick = Am schnellsten, mehr Geisterbilder
x4.fast-refresh.custom = Eigene Werte (Entwickler-Einstellungen)
x4.ssd1677.fast-frames = Schnelle Änderungen: Frames
x4.ssd1677.fast-frames.help = Wie viele Frames ein geändertes Pixel bei einem schnellen Refresh angesteuert wird, wenn *Schnelle Änderungen* auf *Eigene Werte* steht. Weniger ist schneller und lässt mehr Geisterbilder. Wird mit den anderen in Ordnung gehalten: mit dem Kick höchstens 20.
x4.ssd1677.fast-kick = Schnelle Änderungen: Kick
x4.ssd1677.fast-kick.help = Frames der anderen Farbe, die zuerst angesteuert werden, um die Partikel in Bewegung zu bringen: bis 3, jeder kostet Zeit. Gilt, wenn *Schnelle Änderungen* auf *Eigene Werte* steht.
x4.ssd1677.mono-frames = Schwarz-Weiß: Frames
x4.ssd1677.mono-frames.help = Wie viele Frames ein geändertes Pixel bei einem Schwarz-Weiß-Refresh angesteuert wird, den Bildschirme bekommen, die den schnellsten verlangen (Spiele). 1 dauert etwa 100 ms. Nie mehr als eine schnelle Änderung.
x4.ssd1677.mono-kick = Schwarz-Weiß: Kick
x4.ssd1677.mono-kick.help = Frames der anderen Farbe, die bei einem Schwarz-Weiß-Refresh zuerst angesteuert werden: bis 3, jeder kostet Zeit.
x4.lab.repeat = Wiederholung
x4.lab.rate = Bildrate
x4.lab.polarity = Pegel für Weiß und Schwarz
x4.lab.polarity.normal = Wie angenommen
x4.lab.polarity.swapped = Vertauscht
x4.lab.help.touch = Bild antippen: wechseln. Zeile antippen: linke Hälfte weniger, rechte mehr.
x4.lab.hold = Halten
x4.uc8179.fast-refresh = Schnelle Änderungen
x4.uc8179.fast-refresh.help = Wie Menüs und ein verschobener Fokus angezeigt werden. Die Art des Displays braucht etwa 0,6 Sekunden; die anderen sind schneller, mit etwas mehr Geisterbildern (schwache Spuren von vorher), die der nächste Seitenwechsel oder volle Refresh löscht.
x4.uc8179.fast-refresh.panel = Die des Displays (am langsamsten, am saubersten)
x4.uc8179.fast-refresh.clean = Schnell, wenig Geisterbilder
x4.uc8179.fast-refresh.balanced = Schneller, etwas Geisterbilder
x4.uc8179.fast-refresh.quick = Am schnellsten, mehr Geisterbilder
x4.uc8179.fast-refresh.custom = Eigene Werte (Entwickler-Einstellungen)
x4.uc8179.fast-frames = Schnelle Änderungen: Frames
x4.uc8179.fast-frames.help = Wie viele Frames ein geändertes Pixel bei einem schnellen Refresh angesteuert wird, wenn *Schnelle Änderungen* auf *Eigene Werte* steht: je 20 ms bei 50 Hz. Weniger ist schneller und lässt mehr Geisterbilder.
x4.uc8179.fast-hold = Schnelle Änderungen: gehaltene Frames
x4.uc8179.fast-hold.help = Frames, in denen Pixel, die gleich bleiben, auf ihre eigene Farbe angesteuert werden, 0 bis 3; das hält die Geisterbilder früherer Frames klein. Gilt, wenn *Schnelle Änderungen* auf *Eigene Werte* steht.
x4.uc8179.fast-kick = Schnelle Änderungen: Kick
x4.uc8179.fast-kick.help = Frames der anderen Farbe, die zuerst angesteuert werden, um die Partikel in Bewegung zu bringen: bis 3, jeder kostet Zeit. Gilt, wenn *Schnelle Änderungen* auf *Eigene Werte* steht.
x4.uc8179.fast-rate = Schnelle Änderungen: Bildrate
x4.uc8179.fast-rate.help = Die Bildrate des Controllers in Hertz, 20 bis 200 (seine eigene ist 50). Gilt, wenn *Schnelle Änderungen* auf *Eigene Werte* steht; bei gleicher Ansteuerzeit spart eine höhere Rate etwas Zeit und kostet etwas Farbtiefe.
x4.uc8179.transfer = Übertragung schneller Änderungen
x4.uc8179.transfer.help = Wie viel vom Bild der Controller bei einer schnellen Änderung bekommt. Das Auffrischen betrifft immer das ganze Display, nur die Übertragung schrumpft. *Ganzes Bild* tut, was die Original-Firmware tut (am langsamsten). *Geänderte Zeilen* schickt nur den Bereich, der sich geändert hat, in beide Speicher. *Nur neu* schickt ihn nur in den neuen Speicher und lässt den Controller den alten selbst nachziehen (am schnellsten, am meisten Annahmen). Stimmt das Bild nicht, zurück auf *Ganzes Bild*.
x4.uc8179.transfer.whole = Ganzes Bild
x4.uc8179.transfer.changed = Geänderte Zeilen
x4.uc8179.transfer.copied = Nur neu, Controller kopiert
x4.uc8179.mono-frames = Schnellster Refresh: Frames
x4.uc8179.mono-frames.help = Frames, mit denen ein geänderter Pixel angesteuert wird, wenn ein Bildschirm den schnellsten Refresh verlangt (Spiele). Weniger ist schneller und lässt mehr Geisterbilder.
x4.uc8179.mono-hold = Schnellster Refresh: Hold
x4.uc8179.mono-hold.help = Frames, die auch die Pixel ansteuern, die bleiben (0 bis 3): weniger Geisterbilder, aber jeder Frame kostet Zeit. Bei 0 bleiben Geisterbilder, bis ein voller Refresh sie löscht.
x4.uc8179.mono-rate = Schnellster Refresh: Bildrate
x4.uc8179.mono-rate.help = Die Bildrate des Controllers in Hertz, 20 bis 200 (seine eigene ist 50). Höher ist schneller und kostet etwas Farbtiefe.
x4.power-off-after = Nach dem Schlafen ausschalten
x4.power-off-after.help = Ein Druck weckt sofort. Nach etwa dieser Zeit im Schlaf schaltet es sich aus. Nie: bleibt im Schlaf (ein schwacher Akku schaltet es trotzdem aus).
x4.power-off-after.now = Sofort
x4.power-off-after.m15 = Nach 15 Minuten
x4.power-off-after.m30 = Nach 30 Minuten
x4.power-off-after.h1 = Nach 1 Stunde
x4.power-off-after.h2 = Nach 2 Stunden
x4.power-off-after.never = Nie
