x4.button-response = Button response
x4.button-response.help = Faster answers presses a little sooner on battery, and the X4 Pro's screen turns pages a little faster; it uses a little more battery.
x4.button-response.normal = Normal
x4.button-response.faster = Faster
x4.light-sleep = Sleep lightly on battery
x4.light-sleep.help = While nothing happens on battery, the processor sleeps between readings of the buttons. Off only to measure the difference: the battery lasts much shorter.
x4.frontlight = Front light
x4.frontlight.help = How bright the light in front of the screen shines; 0 is off. It goes off while the device sleeps.
x4.warmth = Light colour
x4.warmth.help = How warm (yellow) the light is: 0 is cool white, 100 all warm, kinder to the eyes in the evening.
