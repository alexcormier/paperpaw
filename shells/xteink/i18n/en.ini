[messages]
x4.button-response = Button response
x4.button-response.help = Faster answers presses a little sooner on battery, and the X4 Pro's screen turns pages a little faster; it uses a little more battery.
x4.button-response.normal = Normal
x4.button-response.faster = Faster
x4.light-sleep = Sleep lightly on battery
x4.light-sleep.help = While nothing happens on battery, the processor sleeps between readings of the buttons. Off only to measure the difference: the battery lasts much shorter.
x4.frontlight = Front light
x4.frontlight.help = How bright the light in front of the screen shines; 0 is off. It goes off while the device sleeps.
x4.warmth = Light colour
x4.warmth.help = How warm (yellow) the light is: 0 is cool white, 100 all warm, kinder to the eyes in the evening.
x4.lab.title = Waveform lab
x4.lab.waveform = Waveform
x4.lab.waveform.panel = Panel's own
x4.lab.waveform.temperature = Panel's, at a temperature
x4.lab.waveform.direct = Direct drive
x4.lab.temperature = Temperature
x4.lab.frames = Frames
x4.lab.kick = Kick
x4.lab.picture = Picture
x4.lab.picture.stripes = Stripes
x4.lab.picture.squares = Squares
x4.lab.picture.halves = Halves
x4.lab.picture.lines = Lines
x4.lab.auto = Flip on its own
x4.lab.clean = Clean up
x4.lab.previous = Last frame
x4.lab.flips = Flips
x4.lab.none = No frame yet
x4.lab.help = Up/down: row. Left/right: change. Select: flip.
x4.lab.clean-soon = Ghosts build up: clean up soon.
x4.lab.unsupported = This panel cannot be driven with other waveforms; the lab is for the X4.
x4.fast-refresh = Fast changes
x4.fast-refresh.help = How menus and a moved focus are shown. The panel's own takes about half a second; the others are quicker but leave more ghosting (faint traces of what was before), which the next page turn or full refresh clears.
x4.fast-refresh.panel = Panel's own (slowest, cleanest)
x4.fast-refresh.clean = Quick, little ghosting
x4.fast-refresh.balanced = Quicker, some ghosting
x4.fast-refresh.quick = Quickest, more ghosting
x4.fast-refresh.custom = Own values (Developer settings)
x4.ssd1677.fast-frames = Fast changes: frames
x4.ssd1677.fast-frames.help = How many frames a changed pixel is driven in a fast refresh, where *Fast changes* is *Own values*. Fewer is faster and leaves more ghosting. Kept in order with the others: at most 20 with the kick.
x4.ssd1677.fast-kick = Fast changes: kick
x4.ssd1677.fast-kick.help = Frames of the other colour driven first, to start the particles: up to 3, each costs time. Used where *Fast changes* is *Own values*.
x4.ssd1677.mono-frames = Black and white: frames
x4.ssd1677.mono-frames.help = How many frames a changed pixel is driven in a black and white refresh, which screens that ask for the fastest one get (games). 1 takes about 100 ms. Never more than a fast change.
x4.ssd1677.mono-kick = Black and white: kick
x4.ssd1677.mono-kick.help = Frames of the other colour driven first in a black and white refresh: up to 3, each costs time.
x4.lab.repeat = Repeat
x4.lab.rate = Frame rate
x4.lab.polarity = Levels of white and black
x4.lab.polarity.normal = As assumed
x4.lab.polarity.swapped = Turned round
x4.lab.help.touch = Tap the picture to flip it. Tap a row: left half less, right half more.
x4.lab.hold = Hold
x4.uc8179.fast-refresh = Fast changes
x4.uc8179.fast-refresh.help = How menus and a moved focus are shown. The panel's own takes about 0.6 seconds; the others are quicker, with a little more ghosting (faint traces of what was before), which the next page turn or full refresh clears.
x4.uc8179.fast-refresh.panel = Panel's own (slowest, cleanest)
x4.uc8179.fast-refresh.clean = Quick, little ghosting
x4.uc8179.fast-refresh.balanced = Quicker, some ghosting
x4.uc8179.fast-refresh.quick = Quickest, more ghosting
x4.uc8179.fast-refresh.custom = Own values (Developer settings)
x4.uc8179.fast-frames = Fast changes: frames
x4.uc8179.fast-frames.help = How many frames a changed pixel is driven in a fast refresh, where *Fast changes* is *Own values*: 20 ms each at 50 Hz. Fewer is faster and leaves more ghosting.
x4.uc8179.fast-hold = Fast changes: held frames
x4.uc8179.fast-hold.help = Frames in which the pixels that stay are driven to their own colour, 0 to 3, which keeps the ghosts of earlier frames down. Used where *Fast changes* is *Own values*.
x4.uc8179.fast-kick = Fast changes: kick
x4.uc8179.fast-kick.help = Frames of the other colour driven first, to start the particles: up to 3, each costs time. Used where *Fast changes* is *Own values*.
x4.uc8179.fast-rate = Fast changes: frame rate
x4.uc8179.fast-rate.help = The controller's frame rate in hertz, 20 to 100 (its own is 50). Used where *Fast changes* is *Own values*; at the same drive time a higher rate saves a little time and costs some depth of colour.
x4.uc8179.transfer = Fast changes: transfer
x4.uc8179.transfer.help = How much of the picture the controller gets for a fast change. The refresh always covers the whole display, only the transfer shrinks. *Whole picture* does what the stock firmware does. *Changed rows* sends only the area that changed, into both memories. *New only* sends it into the new memory alone and lets the controller copy the old one itself (fastest, most assumptions). If the picture is wrong, go back to *Whole picture*.
x4.uc8179.transfer.whole = Whole picture
x4.uc8179.transfer.changed = Changed rows
x4.uc8179.transfer.copied = New only, controller copies
x4.uc8179.mono-frames = Fastest refresh: frames
x4.uc8179.mono-frames.help = Frames a changed pixel is driven when a screen asks for the fastest refresh (games). Fewer is quicker and leaves more ghosting.
x4.uc8179.mono-hold = Fastest refresh: hold
x4.uc8179.mono-hold.help = Frames that also drive the pixels that stay (0 to 3): less ghosting, but each frame costs time. At 0 ghosts stay until a full refresh clears them.
x4.uc8179.mono-rate = Fastest refresh: frame rate
x4.uc8179.mono-rate.help = The controller's frame rate in hertz, 20 to 100 (its own is 50). Higher is quicker and costs some depth of colour.
