# The X4's chip: an ESP32-C3 (RISC-V). `cargo run --release` flashes it
# with espflash (`cargo install espflash`) and shows its log. The OTA data
# is erased, so the firmware flashed starts rather than one installed as
# an update before.
#
# The X4 Pro's: an ESP32-S3 (Xtensa), with the `esp` toolchain (espup):
# `cargo +esp x4pro` builds it, `cargo +esp x4pro-run` flashes it (over
# the stock firmware, hold its power button meanwhile: its boot loader
# does not keep it on; PaperPaw does). The X4 Classic's alike:
# `cargo +esp x4classic`, `cargo +esp x4classic-run`.
[build]
target = "riscv32imc-unknown-none-elf"
# No compiler wrapper such as sccache, even if one is set for all builds:
# the firmware's link-time optimisation fails through it, without a message.
rustc-wrapper = ""

[alias]
x4pro = "build --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote -Zbuild-std=core,alloc"
x4pro-run = "run --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote -Zbuild-std=core,alloc"
x4pro-clippy = "clippy --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-pro,remote -Zbuild-std=core,alloc"
x4classic = "build --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-classic,remote -Zbuild-std=core,alloc"
# With its own partitions, which keep the factory's NVS (see
# `partitions-classic.csv`).
x4classic-run = [
    "run", "--release", "--target", "xtensa-esp32s3-none-elf", "--no-default-features",
    "--features", "x4-classic,remote", "-Zbuild-std=core,alloc", "--config",
    'target.xtensa-esp32s3-none-elf.runner = "espflash flash --monitor --chip esp32s3 --erase-parts otadata --partition-table partitions-classic.csv"',
]
x4classic-clippy = "clippy --release --target xtensa-esp32s3-none-elf --no-default-features --features x4-classic,remote -Zbuild-std=core,alloc"
# The X3 (experimental): the X4's chip, built as the X4 is.
x3 = "build --release --no-default-features --features x3,remote"
x3-run = "run --release --no-default-features --features x3,remote"
x3-clippy = "clippy --release --no-default-features --features x3,remote"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor --chip esp32s3 --erase-parts otadata"

[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor --chip esp32c3 --erase-parts otadata"
# Frame pointers for backtraces; the linker script is in build.rs.
rustflags = ["-C", "force-frame-pointers"]

[env]
ESP_LOG = "info"
# Font packs: code and data share the 8 MB of flash the chip maps and an
# app partition's 7.9 MB (and an update's download), so up to 36 px
# (about 12 pt on its 220 dpi screen), not the 40 and 48 px of larger
# screens.
PAPERPAW_FONT_SIZES = "20,24,28,32,36"
