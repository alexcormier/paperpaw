[package]
name = "paperpaw-sqlite"
description = "Reads and writes SQLite database files page by page, e.g. to exchange KOReader's statistics (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "database", "parser-implementations"]
keywords = ["sqlite", "no-std"]

[dependencies]
paperpaw-platform.workspace = true

[dev-dependencies]
proptest.workspace = true
# Real SQLite, to check that written files are valid and that files it
# writes are read (public domain, built from source; tests only).
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
