[package]
name = "paperpaw-native"
description = "PaperPaw's native code plugin files (.ppn): their format, authors' signatures, how they are checked and moved to where they run, the table the firmware gives them, and what the X4 keeps behind its firmware (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["plugin", "loader", "relocation", "esp32", "e-reader"]
# The linker script for plugins goes with the format (build.rs).
include = ["src", "build.rs", "paperpaw-plugin.x", "tests"]

[dependencies]
paperpaw-digest.workspace = true
# Authors' signatures (`signature`). Small code, as the firmware's.
ed25519-compact = { version = "2.6", default-features = false, features = ["opt_size"] }

[lints]
workspace = true
