[package]
name = "paperpaw-native"
description = "PaperPaw's native code plugin files (.ppn): their format, how they are checked and moved to where they run, the table the firmware gives them, and the index of plugins kept in flash (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["plugin", "loader", "relocation", "esp32", "e-reader"]
# The linker script for plugins goes with the format (build.rs).
include = ["src", "build.rs", "paperpaw-plugin.x"]

[dependencies]
paperpaw-digest.workspace = true

[lints]
workspace = true
