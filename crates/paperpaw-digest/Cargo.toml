[package]
name = "paperpaw-digest"
description = "Digests PaperPaw needs to work with others: MD5 (KOReader's book fingerprints), SHA-1, SHA-256, and FNV-1a for stable short ids (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "algorithms"]
keywords = ["md5", "sha1", "sha256", "fnv", "no-std"]

[dependencies]
paperpaw-platform.workspace = true

[dev-dependencies]
# What SHA-256 is checked against (see `sha256`'s documentation for why
# PaperPaw has its own).
sha2 = { version = "0.11.1", default-features = false }
proptest.workspace = true

[lints]
workspace = true
