[package]
name = "paperpaw-digest"
description = "Digests PaperPaw needs to work with others: MD5 (KOReader's book fingerprints), SHA-1, SHA-256, and FNV-1a for stable short ids (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "algorithms"]
keywords = ["md5", "sha1", "sha256", "fnv", "no-std"]

[dependencies]
paperpaw-platform.workspace = true
# RustCrypto's SHA-256, in the X4's firmware already (its bootloader
# crate's): no assembly, no CPU detection on the targets PaperPaw runs on.
sha2 = { version = "0.11.1", default-features = false }

[lints]
workspace = true
