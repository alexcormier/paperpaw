# Every part of the configuration dialect (ADR 0006), version 1.
; Comments start with '#' or ';', also after leading whitespace.
   # an indented comment

top-level = before any section
dotted.key-with_dash@2 = 1

[display]
full-refresh-interval = 6
night-mode = off
	tabbed	=	value between tabs
empty =

[messages]
greeting = Hello, {name}!
literal = # not a comment; \n stays as written
equals = a = b = c
padded = "  quoted values keep spaces  "
escapes = "tab\tnewline\nquote\"backslash\\"
unicode = "\u{1F4D6} \u{e4}\u{0041}"
quoted-empty = ""
non-ascii = Größe, Maß, Ελληνικά, 日本語

[display]
night-mode = on

[ spaced.section ]
key=value
