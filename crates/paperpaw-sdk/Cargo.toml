[package]
name = "paperpaw-sdk"
description = "The PaperPaw plugin SDK, the only API plugins (including first-party ones) use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "api-bindings"]
keywords = ["e-reader", "plugin", "sdk"]

[dependencies]
paperpaw-platform.workspace = true
paperpaw-graphics.workspace = true
paperpaw-i18n.workspace = true
paperpaw-config.workspace = true
paperpaw-text.workspace = true
paperpaw-document.workspace = true
paperpaw-layout.workspace = true
paperpaw-xml.workspace = true
paperpaw-zip.workspace = true
paperpaw-hyphen.workspace = true
paperpaw-image.workspace = true
paperpaw-update.workspace = true
paperpaw-digest.workspace = true
paperpaw-json.workspace = true
paperpaw-qr.workspace = true
# Native code plugins' files and the table plugins are given (`native`).
paperpaw-native.workspace = true

[dev-dependencies]
# The tests build environments as the kernel does.
paperpaw-sdk = { path = ".", features = ["kernel"] }
proptest.workspace = true
# A FAT card in memory, as the X4's, for tests that count the memory
# taken beside it.
paperpaw-fat.workspace = true
fatfs = { git = "https://github.com/rafalh/rust-fatfs", rev = "38b3a7950bf0e765e34286d1dfe76c519ee347e2", default-features = false, features = ["alloc", "lfn", "unicode", "std"] }
# Scalable fonts in tests that draw text (the UI font of fonts-default).
paperpaw-text = { workspace = true, features = ["outline"] }

[features]
default = []
# Building blocks still changing before 1.0 (`layout`, `zip`): a plugin
# that uses them names this feature and follows their changes. Adds only
# modules and functions, never a field or variant: a plugin's fingerprint
# does not change with it.
unstable = []
# What only the kernel and the shells do: registering, setting, binding
# (ADR 0020). Off for plugins, which get these only to read through
# `Env`. Adds only functions, never a field or variant: a plugin's
# fingerprint does not change with it.
kernel = []
# Makers of what the kernel hands plugins (Bluetooth devices, handles),
# for a plugin's own tests with made-up events. Adds only functions.
testing = []
# Scalable OpenType/TrueType fonts (see paperpaw-text).
outline = ["paperpaw-text/outline"]

[lints]
workspace = true

[package.metadata.docs.rs]
# The kernel's part shown too, marked as needing the `kernel` feature.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
