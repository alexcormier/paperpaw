[package]
name = "paperpaw-image"
description = "Streaming JPEG and PNG decoding to grayscale for PaperPaw, with bounded memory (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "multimedia::images"]
keywords = ["jpeg", "png", "e-ink", "no-std"]

[dependencies]
paperpaw-platform.workspace = true
# An exact version: its decompressor lies inside types that cross
# between a code plugin and PaperPaw (ADR 0026).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
