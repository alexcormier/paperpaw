[package]
name = "paperpaw-core"
description = "The PaperPaw kernel: plugin host, registries, input routing and rendering (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "embedded"]
keywords = ["e-reader", "e-ink", "epaper"]

[features]
default = []
# Colour framebuffers for colour e-ink panels.
color = ["paperpaw-graphics/color"]
# Scalable OpenType/TrueType fonts; not available on the ESP32-C3.
outline = ["paperpaw-sdk/outline"]

[dependencies]
paperpaw-platform.workspace = true
paperpaw-config.workspace = true
paperpaw-graphics.workspace = true
paperpaw-i18n.workspace = true
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-hid.workspace = true

[dev-dependencies]
paperpaw-text.workspace = true
# Loads a native plugin built apart (tests/native_plugin.rs).
libloading = "0.9"
proptest.workspace = true

[lints]
workspace = true
