[package]
name = "paperpaw-app"
description = "The standard PaperPaw app: the first-party plugin set that shells install into the kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
# The plugin crates of this build, for the shells' build scripts.
links = "paperpaw-app"

[features]
default = ["store-plugins", "diagnostics"]
# The plugins the store offers as files too (ADR 0024): built in where a
# shell takes them (Android, the emulator, tests), left out of the X4's
# and the X4 Pro's firmware (see `StorePlugins`).
store-plugins = [
    "dep:paperpaw-plugin-stats",
    "dep:paperpaw-plugin-widgets",
    "dep:paperpaw-plugin-calibre",
    "dep:paperpaw-plugin-kosync",
    "dep:paperpaw-plugin-koreader",
    "dep:paperpaw-plugin-weather",
    "dep:paperpaw-plugin-news",
    "dep:paperpaw-plugin-rules",
    "dep:paperpaw-plugin-profiles",
    "dep:paperpaw-plugin-keys",
    "dep:paperpaw-plugin-menu-editor",
    "dep:paperpaw-plugin-vocabulary",
    "dep:paperpaw-plugin-fonts-browser",
    "dep:paperpaw-plugin-aids",
    "dep:paperpaw-plugin-translate",
    "dep:paperpaw-plugin-battery",
    "dep:paperpaw-plugin-reading-goal",
    "dep:paperpaw-plugin-browser",
    "dep:paperpaw-plugin-readwise",
    "dep:paperpaw-plugin-joplin",
    "dep:paperpaw-plugin-wallabag",
    "dep:paperpaw-plugin-hyphenation-da",
    "dep:paperpaw-plugin-hyphenation-de",
    "dep:paperpaw-plugin-hyphenation-es",
    "dep:paperpaw-plugin-hyphenation-fr",
    "dep:paperpaw-plugin-hyphenation-it",
    "dep:paperpaw-plugin-hyphenation-nb",
    "dep:paperpaw-plugin-hyphenation-nl",
    "dep:paperpaw-plugin-hyphenation-pl",
    "dep:paperpaw-plugin-hyphenation-pt",
    "dep:paperpaw-plugin-hyphenation-ru",
    "dep:paperpaw-plugin-hyphenation-sv",
    "dep:paperpaw-plugin-hyphenation-uk",
]
# The diagnostics screen, for bringing up devices: in developer builds.
diagnostics = ["dep:paperpaw-plugin-diagnostics"]
# Scalable default fonts (needs atomics: not on the ESP32-C3).
outline = ["paperpaw-plugin-fonts-default/outline"]
# Bitmap font packs next to the scalable fonts.
packs = ["paperpaw-plugin-fonts-default/packs"]

[dependencies]
paperpaw-core.workspace = true
paperpaw-plugin-diagnostics = { workspace = true, optional = true }
paperpaw-plugin-dictionary.workspace = true
paperpaw-plugin-files.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, default-features = false }
paperpaw-plugin-fonts-browser = { workspace = true, optional = true }
paperpaw-plugin-store.workspace = true
paperpaw-plugin-format-epub.workspace = true
paperpaw-plugin-format-txt.workspace = true
paperpaw-plugin-format-xtc.workspace = true
paperpaw-plugin-home.workspace = true
paperpaw-plugin-hyphenation.workspace = true
paperpaw-plugin-hyphenation-da = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-es = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-de = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-fr = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-it = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-nb = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-nl = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-pl = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-pt = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-ru = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-sv = { workspace = true, optional = true }
paperpaw-plugin-hyphenation-uk = { workspace = true, optional = true }
paperpaw-plugin-keyboard.workspace = true
paperpaw-plugin-menu.workspace = true
paperpaw-plugin-menu-editor = { workspace = true, optional = true }
paperpaw-plugin-kosync = { workspace = true, optional = true }
paperpaw-plugin-calibre = { workspace = true, optional = true }
paperpaw-plugin-stats = { workspace = true, optional = true }
paperpaw-plugin-battery = { workspace = true, optional = true }
paperpaw-plugin-reading-goal = { workspace = true, optional = true }
paperpaw-plugin-widgets = { workspace = true, optional = true }
paperpaw-plugin-wifi.workspace = true
paperpaw-plugin-bluetooth.workspace = true
paperpaw-plugin-power.workspace = true
paperpaw-plugin-file-manager.workspace = true
paperpaw-plugin-transfer.workspace = true
paperpaw-plugin-browser = { workspace = true, optional = true }
paperpaw-plugin-opds.workspace = true
paperpaw-plugin-rules = { workspace = true, optional = true }
paperpaw-plugin-lock.workspace = true
paperpaw-plugin-profiles = { workspace = true, optional = true }
paperpaw-plugin-keys = { workspace = true, optional = true }
paperpaw-plugin-wikipedia.workspace = true
paperpaw-plugin-aids = { workspace = true, optional = true }
paperpaw-plugin-vocabulary = { workspace = true, optional = true }
paperpaw-plugin-sleep.workspace = true
paperpaw-plugin-translate = { workspace = true, optional = true }
paperpaw-plugin-readwise = { workspace = true, optional = true }
paperpaw-plugin-joplin = { workspace = true, optional = true }
paperpaw-plugin-koreader = { workspace = true, optional = true }
paperpaw-plugin-wallabag = { workspace = true, optional = true }
paperpaw-plugin-about.workspace = true
paperpaw-plugin-setup.workspace = true
paperpaw-plugin-help.workspace = true
paperpaw-plugin-update.workspace = true
paperpaw-plugin-news = { workspace = true, optional = true }
paperpaw-plugin-weather = { workspace = true, optional = true }
paperpaw-plugin-plugin-manager.workspace = true
paperpaw-plugin-reader.workspace = true
paperpaw-plugin-settings.workspace = true

[dev-dependencies]
paperpaw-platform.workspace = true
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[lints]
workspace = true
