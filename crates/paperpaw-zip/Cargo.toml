[package]
name = "paperpaw-zip"
description = "Streaming ZIP reader for PaperPaw: reads archives in place, inflates entries chunk by chunk (no_std)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "compression"]
keywords = ["zip", "epub", "streaming", "no-std"]

[features]
default = []
# ZipBuilder for tests of ZIP-based formats.
testing = []

[dependencies]
paperpaw-platform.workspace = true
# An exact version: its decompressor lies inside types that cross
# between a code plugin and PaperPaw (ADR 0026).
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
# The integration tests build archives with ZipBuilder.
paperpaw-zip = { path = ".", features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true
