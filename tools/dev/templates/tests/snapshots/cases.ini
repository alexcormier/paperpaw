# The snapshot cases: a section a case, its name that of the picture
# (`x4-screen.png` beside this file). `cargo test --test snapshots` and
# `paperpaw-dev check` both draw them.
#
#   screen = <id>                 a screen; param.<key> = <value> its parameters
#   widget = <id> <cols>x<rows>   a widget alone on the home screen, its cell
#   (neither)                     the home screen
#   profile = <id>                the device (`paperpaw-dev --list`), the X4 if left out
#   script = <steps>              after it is shown: down,confirm,wait:300
#   <setting id> = <value>        a setting from the start

[x4-screen]
screen = my-plugin.screen
profile = xteink-x4

[boox-screen-dark]
screen = my-plugin.screen
profile = boox-go-7
core.night-mode = true

[x4-widget-wide]
widget = my-plugin.widget 4x2
profile = xteink-x4
