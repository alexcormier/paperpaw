[package]
name = "paperpaw-dev"
description = "Checks PaperPaw plugins before they are published: galleries of every screen and widget, visual and text checks, flows, budgets and packaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "paperpaw-dev"
path = "src/main.rs"

[dependencies]
paperpaw-emulator = { path = "../../shells/desktop", default-features = false }
paperpaw-core = { workspace = true, features = ["color", "outline"] }
paperpaw-config.workspace = true
paperpaw-digest.workspace = true
paperpaw-fs.workspace = true
paperpaw-graphics = { workspace = true, features = ["color"] }
paperpaw-i18n.workspace = true
paperpaw-native.workspace = true
paperpaw-platform.workspace = true
paperpaw-sdk.workspace = true
png = "0.17"

[dev-dependencies]
# The SDK's sample plugin, run through the harness as a plugin's own
# repository runs its plugin (tests/harness.rs).
paperpaw-sample-hello = { path = "../../samples/hello-plugin" }

[lints]
workspace = true
