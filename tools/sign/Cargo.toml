[package]
name = "paperpaw-sign"
description = "Signs PaperPaw firmware images as update files, makes signing keys, makes native plugin files and signs them, and shows what such files hold"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[dependencies]
paperpaw-update = { workspace = true }
paperpaw-native = { workspace = true }
paperpaw-digest = { workspace = true }
# Only for new keys.
ed25519-compact = { version = "2.6", default-features = false, features = ["random"] }

[lints]
workspace = true
