[package]
name = "paperpaw-bluetooth-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

# Host tests use the firmware's vendored Bluetooth host without adding its
# dependencies or formatter inputs to the main workspace.
[workspace]
resolver = "3"

[dev-dependencies]
paperpaw-core = { path = "../../crates/paperpaw-core" }
trouble-host = { path = "../../patches/trouble-host", version = "=0.7.0", default-features = false, features = ["central", "scan", "gatt", "security"] }
embassy-time = { version = "0.5", features = ["std", "generic-queue-8"] }
critical-section = { version = "1", features = ["std"] }

[profile.dev]
opt-level = 1
