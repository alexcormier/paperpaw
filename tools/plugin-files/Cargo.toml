[dependencies]
paperpaw-sdk = { path = "../../crates/paperpaw-sdk" }
paperpaw-plugin-aids = { path = "../../plugins/aids" }
paperpaw-plugin-battery = { path = "../../plugins/battery" }
paperpaw-plugin-browser = { path = "../../plugins/browser" }
paperpaw-plugin-calibre = { path = "../../plugins/calibre" }
paperpaw-plugin-diagnostics = { path = "../../plugins/diagnostics" }
paperpaw-plugin-fonts-browser = { path = "../../plugins/fonts-browser" }
paperpaw-plugin-joplin = { path = "../../plugins/joplin" }
paperpaw-plugin-keys = { path = "../../plugins/keys" }
paperpaw-plugin-koreader = { path = "../../plugins/koreader" }
paperpaw-plugin-kosync = { path = "../../plugins/kosync" }
paperpaw-plugin-menu-editor = { path = "../../plugins/menu-editor" }
paperpaw-plugin-news = { path = "../../plugins/news" }
paperpaw-plugin-profiles = { path = "../../plugins/profiles" }
paperpaw-plugin-readwise = { path = "../../plugins/readwise" }
paperpaw-plugin-rules = { path = "../../plugins/rules" }
paperpaw-plugin-stats = { path = "../../plugins/stats" }
paperpaw-plugin-translate = { path = "../../plugins/translate" }
paperpaw-plugin-vocabulary = { path = "../../plugins/vocabulary" }
paperpaw-plugin-wallabag = { path = "../../plugins/wallabag" }
paperpaw-plugin-weather = { path = "../../plugins/weather" }
paperpaw-plugin-widgets = { path = "../../plugins/widgets" }

# As the firmware is built: small code, one unit, no unwinding.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Lines in the ELF, for naming the functions of a crash's calls.
debug = "line-tables-only"
