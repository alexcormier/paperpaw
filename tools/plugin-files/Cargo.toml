[package]
name = "paperpaw-plugin-files"
description = "PaperPaw's own plugins that the store offers, as native plugin files (ADR 0024): built, packed and signed by the release pipeline for every release"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# A workspace of its own, as a plugin's repository is: its files must fit
# the firmware built in shells/xteink, with the same compiler and SDK.
