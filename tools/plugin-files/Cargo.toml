path = "src/bin/fonts-browser.rs"
test = false
bench = false

[[bin]]
name = "joplin"
path = "src/bin/joplin.rs"
test = false
bench = false

[[bin]]
name = "keys"
path = "src/bin/keys.rs"
test = false
bench = false

[[bin]]
