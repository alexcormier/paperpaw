vocabulary.setting.sd-folder.help = En la tarjeta SD: un archivo CSV, TSV o de Anki en ella es un mazo.
vocabulary.sd.readme = "Fichas desde archivos\n\nPon aquí un archivo por cada mazo: Español.tsv crea el mazo Español.\nArchivos: .tsv, .csv o .txt, guardados como UTF-8, o .apkg: un mazo de Anki, exportado con la opción Admitir versiones antiguas de Anki marcada. Los tres primeros campos de sus notas pasan a ser front, back y example; no se leen su programación ni su multimedia, y PaperPaw nunca escribe un archivo de Anki.\n\nUna ficha por línea: front, back y un ejemplo (opcional), separados por un tabulador, una coma o un punto y coma. La primera línea puede nombrar las columnas: front, back, example. Ejemplo:\n\nGato\tgato\tEl gato duerme.\n\nDespués, abre Fichas en el lector, elige Fichas en la tarjeta SD y luego Actualizar los mazos desde la tarjeta.\n\nBueno saber:\n- Los mazos se quedan en el lector, con tu progreso. Un archivo se lee cuando es nuevo o ha cambiado, y sus fichas se añaden al mazo o se modifican allí.\n- Si cambias el reverso o el ejemplo de una ficha en el archivo, la ficha cambia y conserva tu progreso.\n- Si cambias el texto del anverso de una ficha, cuenta como ficha nueva, y la antigua empieza de cero. Las fichas se reconocen por su texto del anverso; los espacios y las mayúsculas no cuentan. Guarda un mazo en un archivo (Fichas en la tarjeta SD, Guardar el mazo en la tarjeta) y cada ficha tendrá un número en la columna id: cambia allí un anverso, deja las dos primeras líneas del archivo como están, y la ficha conserva tu progreso.\n- Al guardar se escriben las fichas del mazo. Lo que había en el archivo y no es una ficha (una línea sin anverso) no se conserva; el archivo que había se copia a _name.bak.tsv.\n- Guarda el archivo como CSV UTF-8 (no como UTF-16 ni en el formato propio de una hoja de cálculo). Un archivo de más de 4 MiB o de 20.000 líneas no se lee: divídelo.\n- Si borras una línea del archivo, no se borra la ficha del mazo, salvo que actives Quitar las fichas que faltan para ese mazo. Entonces la ficha se va junto con su progreso.\n- Los archivos cuyo nombre empieza por _ no se leen.\n"
