vocabulary.sd.readme = "بطاقات من ملفات\n\nضع هنا ملفًا لكل مجموعة: الملف Spanish.tsv ينشئ المجموعة Spanish.\nالملفات: .tsv أو .csv أو .txt محفوظة بترميز UTF-8، أو .apkg: مجموعة Anki مصدّرة مع تفعيل Support older Anki versions. تصبح أول ثلاثة حقول في ملاحظاتها هي الوجه والظهر والمثال؛ ولا تُقرأ جدولتها ولا وسائطها، ولا يكتب PaperPaw ملف Anki أبدًا.\n\nبطاقة واحدة في كل سطر: الوجه والظهر ومثال (اختياري)، مفصولة بعلامة جدولة أو فاصلة أو فاصلة منقوطة. قد يسمي السطر الأول الأعمدة: front, back, example. مثال:\n\nKatze\tcat\tDie Katze schläft.\n\nثم افتح البطاقات على القارئ، واختر بطاقات على بطاقة SD ثم تحديث المجموعات.\n\nمن المفيد أن تعرف:\n- تبقى المجموعات على القارئ، مع ما تعلمته. يُقرأ الملف عندما يكون جديدًا أو معدلًا، وتُضاف بطاقاته إلى المجموعة أو تتغير فيها.\n- غيّر ظهر البطاقة أو مثالها في الملف: تتغير البطاقة ويبقى تقدمك.\n- غيّر نص وجه البطاقة: تُحسب بطاقة جديدة، وتبدأ القديمة من الصفر. تُطابَق البطاقات بنص وجهها، ولا تُحسب المسافات ولا حالة الأحرف. احفظ مجموعة في ملف (بطاقات على بطاقة SD، ثم حفظ المجموعة على البطاقة) فيكون لكل بطاقة رقم في عمود id: غيّر وجهًا هناك، وأبقِ أول سطرين من الملف كما هما، فتحتفظ البطاقة بما تعلمته.\n- الحفظ يكتب بطاقات المجموعة. ما كان في الملف وليس بطاقة (سطر بلا وجه) لا يُحفظ؛ والملف الذي كان هناك يُنسخ إلى _name.bak.tsv.\n- احفظ الملف بصيغة CSV UTF-8 (لا UTF-16 ولا صيغة جدول البيانات الخاصة). الملف الأكبر من 4 MiB أو 20,000 سطر لا يُقرأ: قسّمه.\n- السطر الذي تحذفه في الملف لا يحذف البطاقة من المجموعة، إلا إذا فعّلت إزالة البطاقات الناقصة لتلك المجموعة. عندها تذهب البطاقة مع ما تعلمته.\n- الملفات التي تبدأ أسماؤها بـ _ لا تُقرأ.\n"
