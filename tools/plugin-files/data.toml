# PaperPaw's own data plugins the store offers, beside the plugins with
# code of plugins.txt: built by the release (data.py runs `build`, which
# writes the folder `<dir>/<id>`) and published with their entries in the
# release's catalogue ZIP (catalogue.py --data), as the plugins with code
# are. A change to `build` or to an input needs a newer `version`
# (versions.py checks it, as for the plugins with code).
#
# Each: version, group (one of the store's), licence (SPDX), the devices
# it is for, whether the store and the flasher leave it unchosen at first
# (off_by_default), the builder and its inputs, and its name and
# description in English and German (the builder writes them into the
# folder, catalogue.py into the entry).

[literata-styles]
version = "1.0.0"
group = "look"
licence = "OFL-1.1"
devices = ["x4", "x4-pro", "x4-classic"]
build = "tools/literata-packs.py"
inputs = ["plugins/fonts-default/fonts/Literata.ttf", "plugins/fonts-default/fonts/Literata-Italic.ttf", "tools/fontgen", "tools/plugin-files/literata-styles.ini"]
name = "Literata bold and italic"
description = "Bold and italic book text in Literata. Without it, bold and italic words show as regular text."
de.name = "Literata Fett und Kursiv"
de.description = "Fett und kursiv gesetzter Buchtext in Literata. Ohne ihn erscheinen fette und kursive Wörter in normaler Schrift."

[literata-large]
version = "1.1.0"
group = "look"
licence = "OFL-1.1"
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/literata-packs.py"
inputs = ["plugins/fonts-default/fonts/Literata.ttf", "plugins/fonts-default/fonts/Literata-Italic.ttf", "tools/fontgen", "tools/plugin-files/literata-large.ini"]
name = "Literata, larger sizes"
description = "Book text in Literata larger than the firmware's sizes."
de.name = "Literata, größere Schriftgrade"
de.description = "Buchtext in Literata größer als in der Firmware."

[literata-bold-italic]
version = "1.0.1"
group = "look"
licence = "OFL-1.1"
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/literata-packs.py"
inputs = ["plugins/fonts-default/fonts/Literata-Italic.ttf", "tools/fontgen"]
name = "Literata Bold Italic"
description = "Bold italic book text in Literata, where bold stands in for it."
de.name = "Literata Fett Kursiv"
de.description = "Fett-kursiver Buchtext in Literata, wo sonst Fett dafür steht."

# The script packs (the owner decided, 2026-11-01, to offer them with everything else
# that is ready): tools/script-pack.py builds them for the release. The ones with a
# keyboard (points/keyboard.layouts.txt) say formats 3: PaperPaw reads a plugin's
# points from there on.

[script-arabic]
version = "1.1.2"
group = "languages"
licence = "OFL-1.1"
formats = 3
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["tools/fonts/NotoNaskhArabic.ttf", "tools/fontgen", "crates/paperpaw-text/src/marks.rs", "tools/plugin-files/keyboards/arabic.txt"]
name = "Arabic letters"
description = "Arabic, Persian and Urdu books in Noto Naskh Arabic, with their vowel marks, and keyboards for typing them."
de.name = "Arabische Schrift"
de.description = "Bücher auf Arabisch, Persisch und Urdu in Noto Naskh Arabic, mit ihren Vokalzeichen, und Tastaturen dafür."

[script-hebrew]
version = "1.1.2"
group = "languages"
licence = "OFL-1.1"
formats = 3
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["tools/fonts/NotoSerifHebrew.ttf", "tools/fontgen", "crates/paperpaw-text/src/marks.rs", "tools/plugin-files/keyboards/hebrew.txt"]
name = "Hebrew letters"
description = "Hebrew books in Noto Serif Hebrew, with their points, and a keyboard for typing it."
de.name = "Hebräische Schrift"
de.description = "Bücher auf Hebräisch in Noto Serif Hebrew, mit ihren Punkten, und eine Tastatur dafür."

[script-greek]
version = "1.0.2"
group = "languages"
licence = "OFL-1.1"
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["plugins/fonts-default/fonts/Literata.ttf", "plugins/fonts-default/fonts/Literata-Italic.ttf", "plugins/fonts-default/fonts/SourceSans3.ttf", "tools/fontgen", "crates/paperpaw-text/src/charset.rs"]
name = "Greek letters"
description = "Greek books in Literata, modern and with the older accents."
de.name = "Griechische Schrift"
de.description = "Bücher auf Griechisch in Literata, modern und mit den älteren Akzenten."

[script-cyrillic]
version = "1.0.2"
group = "languages"
licence = "OFL-1.1"
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["plugins/fonts-default/fonts/Literata.ttf", "plugins/fonts-default/fonts/Literata-Italic.ttf", "plugins/fonts-default/fonts/SourceSans3.ttf", "tools/fontgen", "crates/paperpaw-text/src/charset.rs"]
name = "Cyrillic letters"
description = "Russian, Ukrainian, Bulgarian, Serbian and other Cyrillic books in Literata."
de.name = "Kyrillische Schrift"
de.description = "Bücher auf Russisch, Ukrainisch, Bulgarisch, Serbisch und anderen kyrillischen Sprachen in Literata."

[language-ar]
version = "1.0.3"
group = "languages"
licence = "Apache-2.0"
formats = 4
requires = ["script-arabic"]
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/language-pack.py"
inputs = ["tools/plugin-files/languages/ar.ini", "tools/language-pack.py", "tools/sign"]
name = "Arabic (user interface)"
description = "PaperPaw's menus and settings in Arabic, running from right to left. Needs Arabic letters."
de.name = "Arabisch (Oberfläche)"
de.description = "PaperPaws Menüs und Einstellungen auf Arabisch, von rechts nach links. Braucht die Arabische Schrift."
how = "PaperPaw's menus and settings in Arabic, running from right to left.\n\nIt needs the Arabic letters pack (Arabic letters, in the store): without it the menus show boxes instead of letters. Install both; PaperPaw does not fetch the letters by itself yet."
de.how = "PaperPaws Menüs und Einstellungen auf Arabisch, von rechts nach links.\n\nSie braucht die Arabische Schrift (im Store): ohne sie zeigen die Menüs Kästchen statt Buchstaben. Installiere beide; PaperPaw holt die Schrift noch nicht selbst."

[language-es]
version = "1.0.1"
group = "languages"
licence = "Apache-2.0"
formats = 4
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/language-pack.py"
inputs = ["tools/plugin-files/languages/es.ini", "tools/language-pack.py", "tools/sign"]
name = "Spanish (user interface)"
description = "PaperPaw's menus and settings in Spanish."
de.name = "Spanisch (Oberfläche)"
de.description = "PaperPaws Menüs und Einstellungen auf Spanisch."

# The Korean packs (#61; owner decision: in the store from the beta).
# script-korean (#61): the 2,350 Hangul syllables of KS X 1001 with CJK
# punctuation, compatibility jamo and full-width forms (2,602 characters),
# seven sizes, one face, from Nanum Myeongjo: 8.2 MiB on the card. Its pack
# extends Literata's regular face; bold, italic and the interface's font
# fall back to it. A pack holds up to 65,535 characters, so all 11,172
# syllables (`hangul`) can come later as data, without a new interface.
[script-korean]
version = "1.1.3"
group = "languages"
licence = "OFL-1.1"
formats = 3
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["tools/fonts/NanumMyeongjo-Regular.ttf", "tools/fontgen", "crates/paperpaw-text/src/charset.rs", "tools/plugin-files/keyboards/korean.txt"]
name = "Korean letters"
description = "Korean books in a classic book face: the 2,350 Hangul syllables of everyday text, and a keyboard for typing Korean."
de.name = "Koreanische Schrift"
de.description = "Bücher auf Koreanisch in einer klassischen Buchschrift: die 2.350 Hangul-Silben des Alltags, und eine Tastatur dafür."

# script-korean-extra (#61, owner decision 43): the other 8,822 of the
# 11,172 Hangul syllables, rare ones outside KS X 1001, as a pack of its
# own that only adds letters to script-korean (it needs that pack, and
# brings no letters of its own beyond them). About 30 MiB on the card, so
# the reader offers it only for a book that uses such syllables.
[script-korean-extra]
version = "1.0.2"
group = "languages"
licence = "OFL-1.1"
formats = 4
requires = ["script-korean"]
devices = ["x4", "x4-pro", "x4-classic"]
off_by_default = true
build = "tools/script-pack.py"
inputs = ["tools/fonts/NanumMyeongjo-Regular.ttf", "tools/fontgen", "tools/fontgen/sets/hangul-rest.txt"]
name = "Korean letters, rare syllables"
description = "The rare Hangul syllables outside everyday text, for books that use them. Needs Korean letters. About 30 MiB on the card."
de.name = "Koreanische Schrift, seltene Silben"
de.description = "Die seltenen Hangul-Silben außerhalb des Alltagstexts, für Bücher, die sie brauchen. Braucht die Koreanische Schrift. Etwa 30 MiB auf der Karte."
how = "Korean letters shows the 2,350 Hangul syllables of everyday text. A few books use rarer ones, which then show as question marks. This pack adds the other 8,822 syllables.\n\nIt needs Korean letters and about 30 MiB on the memory card (flash is not used). Install it only if a book shows question marks in Korean text; PaperPaw offers it for such books. It adds letters only and changes nothing else."
de.how = "Die Koreanische Schrift zeigt die 2.350 Hangul-Silben des Alltagstexts. Einige Bücher brauchen seltenere Silben, die dann als Fragezeichen erscheinen. Dieses Paket ergänzt die übrigen 8.822 Silben.\n\nEs braucht die Koreanische Schrift und etwa 30 MiB auf der Speicherkarte (der Flash-Speicher bleibt unberührt). Installiere es nur, wenn ein Buch in koreanischem Text Fragezeichen zeigt; PaperPaw bietet es für solche Bücher an. Es ergänzt nur Buchstaben und ändert sonst nichts."
