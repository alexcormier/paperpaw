[messages]
lock.plugin.name = Screen lock
lock.plugin.description = A PIN, a pattern or a password when the device wakes up.
lock.setting.kind = Screen lock
lock.setting.kind.help = Asks for a PIN, a pattern or a password when PaperPaw starts and when the device wakes up. It keeps others from casual use, not from someone who takes the files.
lock.setting.on-wake = Lock when waking up
lock.setting.on-wake.help = Off: the lock is asked for only when PaperPaw starts and by “Lock now”. Where every wake is a start (the X4 on battery), it is asked for then too.
lock.kind.off = Off
lock.kind.pin = PIN
lock.kind.pattern = Pattern
lock.kind.password = Password
lock.now = Lock now
lock.secret = Screen lock (kept as a hash)
lock.enter-pin = Enter the PIN
lock.draw-pattern = Draw the pattern
lock.enter-password = Enter the password
lock.current-pin = Enter the current PIN
lock.current-pattern = Draw the current pattern
lock.current-password = Enter the current password
lock.new-pin = New PIN
lock.new-pattern = Draw a new pattern
lock.new-password = New password
lock.again = Once more, to be sure
lock.type-password = Type the password
lock.ok = OK
lock.delete = Delete
lock.wrong = That was not right.
lock.mismatch = They were not the same. Once more from the start.
# {count} is the shortest length allowed.
lock.too-short = At least {count} digits, dots or characters.
# {count} is a number of seconds.
lock.wait = Too many tries. Wait {count} s.
lock.done = The screen lock is set.
lock.removed = The screen lock is off.
lock.on-its-page = The screen lock is changed on its own page, which asks for the code in use.
lock.touch = Lock touch
lock.touch.help = Taps and swipes do nothing, the buttons still work, e.g. to read with a hand on the screen. To unlock, hold a finger still on the screen for three seconds.
lock.touch-toggle = Lock or unlock touch
lock.touch-status = Touch locked
lock.touch.locked = Touch is locked. To unlock, hold a finger still on the screen for three seconds.
lock.touch.locked.buttons = Touch is locked. To unlock, hold the power button, or a finger still on the screen for three seconds.
lock.touch.unlocked = Touch is unlocked.
