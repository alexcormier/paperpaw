lock.touch = Touch sperren
lock.touch.help = Tippen und Wischen bewirken nichts, die Tasten funktionieren weiter, etwa zum Lesen mit der Hand auf dem Display. Zum Entsperren mit einem Finger zweimal tippen und ihn dann kurz liegen lassen.
lock.touch-toggle = Touch sperren oder entsperren
lock.touch-status = Touch gesperrt
lock.touch.locked = Touch ist gesperrt. Zum Entsperren mit einem Finger zweimal tippen und ihn dann kurz liegen lassen.
lock.touch.locked.buttons = Touch ist gesperrt. Zum Entsperren die Ein/Aus-Taste gedrückt halten oder mit einem Finger zweimal tippen und ihn dann kurz liegen lassen.
lock.touch.unlocked = Touch ist entsperrt.
