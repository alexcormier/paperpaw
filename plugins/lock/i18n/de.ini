lock.plugin.name = Displaysperre
lock.plugin.description = Eine PIN, ein Muster oder ein Passwort beim Aufwachen des Geräts; Touch gesperrt beim Lesen.
lock.setting.kind = Displaysperre
lock.setting.kind.help = Fragt nach PIN, Muster oder Passwort, wenn PaperPaw startet und wenn das Gerät aufwacht. Sie hält andere vom einfachen Benutzen ab, nicht jemanden, der die Dateien nimmt.
lock.setting.on-wake = Beim Aufwachen sperren
lock.setting.on-wake.help = Aus: Die Sperre kommt nur beim Start von PaperPaw und mit „Jetzt sperren“. Wo jedes Aufwachen ein Start ist (der X4 im Akkubetrieb), kommt sie dann auch.
