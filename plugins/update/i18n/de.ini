update.done = Aktualisiert auf PaperPaw {version}
update.undone = Das Update startete nicht: PaperPaw {version} ist zurück.
update.check = Online suchen
update.retry = Noch einmal
update.checking.title = Update wird gesucht
update.checking.help = {server} wird nach einem neueren PaperPaw für dieses Gerät und seine eingebauten Plugins gefragt.
update.up-to-date.title = PaperPaw ist aktuell
update.up-to-date.help = PaperPaw {current} ist die neueste Version für dieses Gerät.
update.dual-boot.title = Zwei Firmwares auf diesem Gerät
update.dual-boot.help = PaperPaw teilt sich dieses Gerät mit einer anderen Firmware und installiert hier deshalb keine Updates. Aktualisiere PaperPaw mit dem Werkzeug, mit dem du das eingerichtet hast. Keine zweite Firmware auf dem Gerät? Sag es mit der Taste unten, oder flashe PaperPaw per USB neu unter paperpaw.org/flash.
update.not-dual.button = Kein Dual-Boot-Gerät
update.not-dual.ask = Keine zweite Firmware auf diesem Gerät?
update.not-dual.warning = "PaperPaw installiert dann hier Updates. Ist auf dem Gerät doch noch eine andere Firmware installiert, kann ein Update sie überschreiben. PaperPaw startet dazu neu.\nRückgängig machen: unter Updates „Dual-Boot wieder erkennen“, oder dual-boot = auto in der paperpaw.ini."
update.not-dual.yes = Ja, neu starten
update.not-dual.no = Abbrechen
update.not-dual.failed = paperpaw.ini konnte nicht geändert werden.
update.dual-auto.button = Dual-Boot wieder erkennen
update.unreachable.title = Keine Antwort
update.unreachable.help = Der Update-Server {server} war nicht erreichbar ({reason}). Ist WLAN eingeschaltet und ein Netz in Reichweite?
update.offer.title = PaperPaw {version} ist da
update.offer.help = Jetzt installiert: PaperPaw {current}. Das Update hat {size}: Das Herunterladen dauert über WLAN ein paar Minuten, dann lässt es sich installieren.
update.offer.help-unsized = Jetzt installiert: PaperPaw {current}. Das Herunterladen dauert über WLAN ein paar Minuten, dann lässt sich das Update installieren.
update.download = Herunterladen
