update.plugin.name = Update
update.plugin.description = Installiert Firmware-Updates, von der Karte oder aus dem Internet geladen.
update.title = Update
update.nothing.title = Kein Update auf der Karte
update.nothing.help = PaperPaw {current} ist installiert. Online nach einem neueren suchen oder eine Update-Datei (von paperpaw.org, endet auf .bin) in den Ordner „/updates“ auf der Karte kopieren, zum Beispiel per WLAN-Übertragung, dann diese Seite wieder öffnen.
update.transfer = WLAN-Übertragung
update.unfit.title = Dieses Update lässt sich nicht installieren
update.ready.title = PaperPaw {version}
update.ready.help = Jetzt installiert: PaperPaw {current}. Das Update dauert etwa eine Minute, dann startet das Gerät neu. Bücher, Einstellungen und Lesepositionen bleiben.
update.unknown.title = PaperPaw {version}, eigener Build
update.unknown.help = Dieses Update ist nicht von PaperPaw signiert, sondern mit dem Schlüssel {key}. Nur installieren, wenn du es selbst gebaut hast und der Schlüssel deiner ist.
update.older.note = Es ist nicht neuer als PaperPaw {current}.
update.install = Installieren
update.install-with-key = Mit diesem Schlüssel installieren
update.foreign.title = Andere Firmware: {name}
update.foreign.help = {file} ist nicht PaperPaw und nicht signiert. Sie ersetzt PaperPaw; die Bücher bleiben auf der Karte. Nur installieren, wenn du ihr vertraust.
update.install-foreign = Trotzdem installieren
update.later = Nicht jetzt
update.ok = OK
