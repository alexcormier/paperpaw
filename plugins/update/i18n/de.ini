update.reason.other-device = Das Update ist für ein anderes Gerät.
update.reason.too-large = Das Update ist zu groß für dieses Gerät.
update.reason.untrusted = Das Update ist mit einem Schlüssel signiert, dem dieses Gerät nicht vertraut.
update.reason.not-newer = Das Update ist nicht neuer als das jetzt installierte PaperPaw.
update.reason.damaged = Die Datei wurde verändert oder ist beschädigt. Bitte noch einmal auf die Karte kopieren.
update.reason.write = Das Schreiben ist fehlgeschlagen.
update.reason.low-battery = Auf 20 % laden oder anstecken, dann installieren.
