update.downloading.help = Das dauert ein paar Minuten. Du kannst die Seite schließen und so lange lesen: Danach liegt das Update im Ordner „/updates“ und lässt sich hier installieren.
update.downloaded = Update heruntergeladen: PaperPaw {version}, bereit zum Installieren unter Update
