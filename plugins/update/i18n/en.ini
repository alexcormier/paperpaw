[messages]
update.plugin.name = Update
update.plugin.description = Installs firmware updates from the card.
update.title = Update
update.nothing.title = No update on the card
update.nothing.help = QuireInk {current} is installed. To update, copy the update file (from quireink.org, ending in .bin) into the folder updates on the card, for example with Wi-Fi transfer, then open this page again.
update.transfer = Wi-Fi transfer
update.unfit.title = This update cannot be installed
update.ready.title = QuireInk {version}
update.ready.help = Installed now: QuireInk {current}. The update takes about a minute, then the device restarts. Books, settings and reading positions stay.
update.unknown.title = QuireInk {version}, own build
update.unknown.help = This update is not signed by QuireInk but with the key {key}. Install it only if you built it yourself: the key is trusted from then on.
update.install = Install
update.trust-install = Trust and install
update.later = Not now
update.ok = OK
update.installing.title = Installing the update
update.installing.help = Please do not switch the device off. It restarts by itself when the update is in place.
update.installed.title = Update installed
update.installed.help = Restarting …
update.failed.title = Update not installed
update.failed.help = {reason} Nothing was changed: QuireInk {current} stays.
update.reason.unreadable = The file could not be read.
update.reason.not-an-update = The file is no update. A whole image for the web flasher is installed from a computer.
update.reason.newer-format = The update needs a newer QuireInk: install the one before it first.
update.reason.other-device = The update is for another device.
update.reason.too-large = The update is too large for this device.
update.reason.untrusted = The update is signed with a key this device does not trust.
update.reason.damaged = The file was changed or damaged. Copy it onto the card again.
update.reason.write = Writing it failed.
update.done = Updated to QuireInk {version}
update.undone = The update did not start: QuireInk {version} is back.
