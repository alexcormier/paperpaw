[package]
name = "paperpaw-plugin-update"
description = "PaperPaw firmware updates: finds an update file on the card or on the update server, says what it is and what plugins cannot come along, and installs it, on devices whose firmware PaperPaw is"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[dependencies]
# Installs firmware and fetches code plugins for it (kernel).
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-digest.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-update.workspace = true

[lints]
workspace = true
