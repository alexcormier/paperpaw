<!doctype html>
<html lang="{lang}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 30rem; padding: 1rem; line-height: 1.4; }
h1 { font-size: 1.4rem; }
label.network { display: flex; gap: .6rem; align-items: center; padding: .7rem .2rem; border-bottom: 1px solid #ddd; }
label.network small { color: #666; margin-left: auto; }
input[type=text], input[type=password] { width: 100%; box-sizing: border-box; font-size: 1.1rem; padding: .6rem; margin: .3rem 0 1rem; }
button { width: 100%; font-size: 1.1rem; padding: .8rem; border-radius: 2rem; border: 0; background: #111; color: #fff; }
p.note { color: #555; }
</style>
</head>
<body>
{body}
</body>
</html>
