[package]
name = "paperpaw-plugin-about"
description = "PaperPaw about page: version, licence and the licences of what it bundles"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n", "build.rs", "licences-firmware.md", "licences-app.md", "logo.png"]

[dependencies]
paperpaw-sdk.workspace = true
# The licences, deflated in parts (build.rs), read one part at a time.
# The version paperpaw-zip uses, so the firmware has one copy.
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[build-dependencies]
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true
