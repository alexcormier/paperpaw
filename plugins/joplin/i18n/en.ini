[meta]
language = en
name = English
plural = one-other

[messages]
joplin.plugin.name = Joplin
joplin.plugin.description = Keeps the highlights and notes of each book in Joplin.
joplin.title = Joplin
joplin.send = Send to Joplin
joplin.send.help = Exported notes are sent at once. Notes that could not be sent wait and go with the next export, with this, or by a rule.
joplin.service = Synchronised with
joplin.service.help = What Joplin synchronises with, as set in Joplin: Joplin Cloud, your own Joplin Server, or a WebDAV folder such as Nextcloud. No computer needs to run.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = Address
joplin.address.help = Joplin Server: its address, e.g. joplin.example.org. WebDAV: the folder Joplin synchronises to, as in its settings, e.g. dav.example.org/Joplin.
joplin.email = E-mail
joplin.user = User name
joplin.user.help = Joplin Cloud and Joplin Server: the e-mail you sign in with (two-factor sign-in cannot be used yet). WebDAV: the folder's user name.
joplin.password = Password
joplin.password.help = Kept with the other passwords and keys on this device. For Nextcloud, an app password works too.
joplin.secret = Joplin password
joplin.notebook = Notebook
joplin.notebook.help = The notebook PaperPaw makes in Joplin, with a note for each book. Exporting again updates the note, also one moved to another notebook.
joplin.idle = Exported notes are sent to Joplin at once.
# {count} is the number of books.
joplin.waiting.one = The notes of {count} book wait to be sent.
joplin.waiting.other = The notes of {count} books wait to be sent.
joplin.sent.one = The notes of {count} book are in Joplin.
joplin.sent.other = The notes of {count} books are in Joplin.
# {sent} and {failed} are numbers of books.
joplin.some-failed = Sent to Joplin: {sent}. Not sent: {failed}; they are sent again later.
# {count} is the number of notes.
joplin.apart.one = {count} note was changed in Joplin, so a new one was made beside it.
joplin.apart.other = {count} notes were changed in Joplin, so new ones were made beside them.
joplin.nothing = No notes wait to be sent to Joplin.
joplin.no-network = Sending to Joplin needs a network. The notes wait and are sent later.
joplin.setup-needed = Set up Joplin first: where it synchronises to, your account and password.
joplin.no-time = The time is not known yet. The notes wait and are sent later.
joplin.unreachable = Joplin cannot be reached. The notes wait and are sent later.
# {status} is the server's answer, a number.
joplin.failed = Joplin answered with an error ({status}). The notes wait and are sent later.
joplin.bad-login = Joplin did not accept the e-mail, user name or password. Check them in Joplin's set-up.
joplin.no-server = There is no Joplin Server at this address. Check it in Joplin's set-up.
joplin.no-data = There are no Joplin notes at this address. Check it, or synchronise Joplin with it first.
joplin.encrypted = Joplin's end-to-end encryption is on. PaperPaw cannot encrypt notes, so it sends none.
joplin.newer-target = Joplin keeps the notes there in a newer format than this PaperPaw knows. Update PaperPaw to send them.
joplin.older-target = Joplin keeps the notes there in an older format. Open Joplin to upgrade it, then send again.
joplin.upgrading = Joplin is upgrading the notes there just now. They wait and are sent later.
joplin.no-memory = Not enough memory to send the notes. Restart and try again.
