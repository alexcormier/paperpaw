[meta]
language = de
name = Deutsch
plural = one-other

[messages]
joplin.plugin.name = Joplin
joplin.plugin.description = Hält die Markierungen und Notizen jedes Buchs in Joplin fest.
joplin.title = Joplin
joplin.send = An Joplin schicken
joplin.send.help = Exportierte Notizen werden sofort geschickt. Was nicht geschickt werden konnte, wartet und geht mit dem nächsten Export, hiermit oder durch eine Regel.
joplin.service = Synchronisiert mit
joplin.service.help = Womit Joplin synchronisiert, wie in Joplin eingestellt: Joplin Cloud, dein eigener Joplin Server oder ein WebDAV-Ordner wie Nextcloud. Kein Computer muss laufen.
joplin.service.cloud = Joplin Cloud
joplin.service.server = Joplin Server
joplin.service.webdav = WebDAV
joplin.address = Adresse
joplin.address.help = Joplin Server: seine Adresse, z. B. joplin.example.org. WebDAV: der Ordner, mit dem Joplin synchronisiert, wie in seinen Einstellungen, z. B. dav.example.org/Joplin.
joplin.email = E-Mail
joplin.user = Benutzername
joplin.user.help = Joplin Cloud und Joplin Server: die E-Mail, mit der du dich anmeldest (Zwei-Faktor-Anmeldung geht noch nicht). WebDAV: der Benutzername des Ordners.
joplin.password = Passwort
joplin.password.help = Aufbewahrt bei den anderen Passwörtern und Schlüsseln auf diesem Gerät. Für Nextcloud geht auch ein App-Passwort.
joplin.secret = Joplin-Passwort
joplin.notebook = Notizbuch
joplin.notebook.help = Das Notizbuch, das PaperPaw in Joplin anlegt, mit einer Notiz je Buch. Ein erneuter Export aktualisiert die Notiz, auch eine in ein anderes Notizbuch verschobene.
joplin.idle = Exportierte Notizen werden sofort an Joplin geschickt.
# {count} ist die Zahl der Bücher.
joplin.waiting.one = Die Notizen von {count} Buch warten darauf, geschickt zu werden.
joplin.waiting.other = Die Notizen von {count} Büchern warten darauf, geschickt zu werden.
joplin.sent.one = Die Notizen von {count} Buch sind in Joplin.
joplin.sent.other = Die Notizen von {count} Büchern sind in Joplin.
# {sent} und {failed} sind Zahlen von Büchern.
joplin.some-failed = An Joplin geschickt: {sent}. Nicht geschickt: {failed}; sie werden später erneut geschickt.
# {count} ist die Zahl der Notizen.
joplin.apart.one = {count} Notiz wurde in Joplin geändert, darum wurde daneben eine neue angelegt.
joplin.apart.other = {count} Notizen wurden in Joplin geändert, darum wurden daneben neue angelegt.
joplin.nothing = Es warten keine Notizen auf Joplin.
joplin.no-network = Für Joplin braucht es ein Netzwerk. Die Notizen warten und werden später geschickt.
joplin.setup-needed = Richte zuerst Joplin ein: womit es synchronisiert, dein Konto und Passwort.
joplin.no-time = Die Uhrzeit ist noch nicht bekannt. Die Notizen warten und werden später geschickt.
joplin.unreachable = Joplin ist nicht erreichbar. Die Notizen warten und werden später geschickt.
# {status} ist die Antwort des Servers, eine Zahl.
joplin.failed = Joplin hat mit einem Fehler geantwortet ({status}). Die Notizen warten und werden später geschickt.
joplin.bad-login = Joplin hat die E-Mail, den Benutzernamen oder das Passwort nicht angenommen. Prüfe sie in der Einrichtung von Joplin.
joplin.no-server = Unter dieser Adresse gibt es keinen Joplin Server. Prüfe sie in der Einrichtung von Joplin.
joplin.no-data = Unter dieser Adresse gibt es keine Joplin-Notizen. Prüfe sie oder synchronisiere Joplin zuerst damit.
joplin.encrypted = Joplins Ende-zu-Ende-Verschlüsselung ist an. PaperPaw kann Notizen nicht verschlüsseln und schickt darum keine.
