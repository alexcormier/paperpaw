[messages]
picture-home.plugin.name = Bild-Startseite
picture-home.plugin.description = Eine Startseite mit deinem eigenen Bild hinter den Widgets und einer Statusleiste, die du einstellst.
picture-home.title = Bild-Startseite
picture-home.add = Hinzufügen
picture-home.add.tools = Werkzeuge
picture-home.add-page = Seite hinzufügen
picture-home.remove-page = Diese Seite entfernen
picture-home.no-room = Dafür ist auf dieser Seite kein Platz.
picture-home.preparing = Das Bild wird vorbereitet
picture-home.preparing.text = Das dauert einen Moment, einmal für jedes Bild und jede Bildschirmgröße.
picture-home.unreadable = Das Bild konnte nicht gelesen werden.
picture-home.short = Für das Bild reicht der Speicher oder der Platz auf der Karte nicht.
picture-home.edit-upright = Drehe den Bildschirm aufrecht, um die Seiten anzuordnen.
picture-home.no-picture = Kein Bild
picture-home.no-pictures.title = Keine Bilder
picture-home.no-pictures = Lege JPEG-, PNG- oder GIF-Bilder in den Ordner „{folder}“ auf der Karte.
picture-home.setting.folder = Bilderordner
picture-home.setting.folder.help = Der Ordner auf der Karte mit deinen Bildern.
picture-home.setting.picture = Bild
picture-home.setting.picture.help = Hinter den Widgets. Ohne Bild bleibt die Seite schlicht.
picture-home.setting.fit = Anpassung
picture-home.setting.fit.help = Wie das Bild den Bildschirm füllt.
picture-home.setting.anchor = Position
picture-home.setting.anchor.help = Welcher Teil bleibt, wo die Ränder abgeschnitten werden, oder wo ein kleineres Bild sitzt.
picture-home.setting.zoom = Zoom
picture-home.setting.zoom.help = In Prozent. Mehr zeigt weniger vom Bild.
picture-home.setting.lighten = Bild aufhellen
picture-home.setting.lighten.help = Blasser, damit Widgets und Text gut lesbar sind. In Prozent.
picture-home.setting.brightness = Helligkeit
picture-home.setting.brightness.help = Wie hell das Bild ist. Heller, wenn es auf deinem Bildschirm zu dunkel wirkt.
picture-home.setting.contrast = Kontrast
picture-home.setting.contrast.help = Wie stark sich dunkle und helle Teile unterscheiden.
picture-home.setting.plate = Widgets stehen auf
picture-home.setting.plate.help = Eine Fläche unter jedem Widget: normal (weiß), hellgrau oder transparent, damit das Bild durchscheint. Bei einem dunklen Bild wähle in den Farben des Widgets eine helle Schrift.
picture-home.setting.render = Bilddarstellung
picture-home.setting.render.help = Graustufen: langsamer. Gerastert: schnell. Automatisch: wie die eingebaute Startseite.
picture-home.setting.bar = Statusleiste
picture-home.setting.bar.help = Uhrzeit, WLAN und Akku. Automatisch: Ein Tastendruck zeigt sie für ein paar Sekunden.
picture-home.setting.bar-at = Statusleiste: Ort
picture-home.setting.bar-at.help = Über oder unter den Widgets.
picture-home.setting.bar-shape = Statusleiste: Form
picture-home.setting.bar-shape.help = Volle Breite oder eine kleine Pille.
picture-home.setting.bar-align = Statusleiste: Seite
picture-home.setting.bar-align.help = Wo die Pille sitzt.
picture-home.setting.bar-look = Statusleiste: Aussehen
picture-home.setting.bar-look.help = Worauf sie liegt. Auf dem Bild ist die Schrift schwarz oder weiß, je nachdem, was lesbar ist.
picture-home.setting.hints = Tastenzeile
picture-home.setting.hints.help = Die Zeile unter dem Bildschirm, die die Tasten nennt. Automatisch: Ein Druck zeigt sie für ein paar Sekunden.
picture-home.setting.bar-left = Statusleiste: links
picture-home.setting.bar-center = Statusleiste: Mitte
picture-home.setting.bar-right = Statusleiste: rechts
picture-home.setting.items.help = Was in diesem Teil der Leiste steht.
picture-home.setting.columns = Spalten
