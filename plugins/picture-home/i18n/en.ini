picture-home.setting.bar-look = Status bar: look
picture-home.setting.bar-look.help = What it is on. Over the picture the text is black or white, whichever reads.
picture-home.setting.hints = Buttons row
picture-home.setting.hints.help = The row naming the buttons below the screen. Automatic: a press shows it for a few seconds.
