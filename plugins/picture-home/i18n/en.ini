picture-home.setting.fit = Fit
picture-home.setting.fit.help = How the picture fills the screen.
picture-home.setting.anchor = Position
picture-home.setting.anchor.help = Which part stays where the edges are cut, or where a smaller picture sits.
picture-home.setting.zoom = Zoom
picture-home.setting.zoom.help = In percent. More shows less of the picture.
picture-home.setting.lighten = Lighten picture
picture-home.setting.lighten.help = Paler, so that widgets and text read well. In percent.
