picture-home.setting.contrast.help = How strongly the dark and light parts differ.
picture-home.setting.plate = Widgets sit on
picture-home.setting.plate.help = A plate under each widget: normal (white), light gray, or transparent, so that the picture shows through. For a dark picture choose a light text colour in the widget's Colours.
