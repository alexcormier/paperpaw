picture-home.setting.render.help = Grey levels: slower. Dithered: fast. Automatic: as the built-in home screen.
picture-home.setting.bar = Status bar
picture-home.setting.bar.help = Time, Wi-Fi and battery. Automatic: a button press shows it for a few seconds.
