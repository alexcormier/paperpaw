[package]
name = "paperpaw-plugin-file-manager"
description = "PaperPaw file manager: open, rename, move, copy and delete files and folders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
# By path alone: the app has this plugin built in, so a version here
# would make the two wait for each other on crates.io; cargo publish
# leaves a dev-dependency without one out.
paperpaw-app = { path = "../../crates/paperpaw-app" }
paperpaw-core.workspace = true
paperpaw-fs.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
proptest.workspace = true
paperpaw-plugin-files.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-format-txt.workspace = true

[lints]
workspace = true
