readwise.plugin.name = Readwise
readwise.plugin.description = Schickt die Markierungen exportierter Notizen an Readwise.
readwise.token = Readwise-Zugangstoken
readwise.needs-token = Für Readwise gib deinen Zugangstoken ein (readwise.io/access_token).
# {count} ist die Zahl der Markierungen.
readwise.sent.one = {count} Markierung an Readwise geschickt.
