[package]
name = "paperpaw-plugin-format-epub"
description = "PaperPaw EPUB 2/3 support: streaming conversion, table of contents, metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "text-processing"]

[dependencies]
paperpaw-digest.workspace = true
paperpaw-sdk.workspace = true
# WOFF fonts: their tables are zlib-compressed.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-zip = { workspace = true, features = ["testing"] }

[lints]
workspace = true
