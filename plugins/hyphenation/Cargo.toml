[package]
name = "paperpaw-plugin-hyphenation"
description = "PaperPaw hyphenation patterns for English"
version = "1.1.0"
edition.workspace = true
rust-version.workspace = true
# The code is Apache-2.0; the patterns are under the FSF all-permissive
# license, see patterns/README.md.
license = "Apache-2.0 AND FSFAP"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "text-processing"]
include = ["src", "how", "patterns", "i18n", "build.rs"]

[dependencies]
paperpaw-sdk.workspace = true

[build-dependencies]
paperpaw-hyphen.workspace = true

[dev-dependencies]
# The tests look at what the plugin adds, as the kernel does.
paperpaw-sdk = { workspace = true, features = ["kernel"] }
paperpaw-i18n.workspace = true
proptest.workspace = true

[lints]
workspace = true
