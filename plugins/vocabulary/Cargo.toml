[package]
name = "paperpaw-plugin-vocabulary"
description = "PaperPaw vocabulary: the words looked up while reading, with their sentences"
version = "1.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[package.metadata.paperpaw]
# What the plugin reads from its folder on the card: the store's package
# holds these files (tools/plugin-files/catalogue.py).
card-files = ["data/phone.txt"]

[features]
# The phone page carried in the code (the plugin as part of an app); a
# plugin file for a reader is built without it and reads it from its
# folder.
default = ["embedded-page"]
embedded-page = []

[dependencies]
paperpaw-sdk.workspace = true
paperpaw-sqlite.workspace = true
paperpaw-zip.workspace = true

[dev-dependencies]
paperpaw-zip = { workspace = true, features = ["testing"] }
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-home.workspace = true
paperpaw-plugin-sleep.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
proptest.workspace = true

[lints]
workspace = true
