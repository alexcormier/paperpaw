vocabulary.sd.readme = "Flash cards from files\n\nPut a file here for each deck: Spanish.tsv makes the deck Spanish.\nFiles: .tsv, .csv or .txt, saved as UTF-8.\n\nOne card on each line: front, back and an example (optional), separated by a tab, a comma or a semicolon. The first line may name the columns: front, back, example. Example:\n\nKatze\tcat\tDie Katze schläft.\n\nThen open Flash cards on the reader, choose Cards on the SD card and then Update the decks from the card.\n\nGood to know:\n- The decks stay on the reader, with what you learnt. A file is read when it is new or changed, and its cards are added to the deck or changed there.\n- Change the back or the example of a card in the file: the card changes and keeps your progress.\n- Change the front text of a card: it counts as a new card, and the old one starts over. Cards are matched by their front text, spaces and capitals do not count. Save a deck to a file (Cards on the SD card, Save the deck to the card) and every card has a number in the id column: change a front there, keep the first two lines of the file as they are, and the card keeps what you learnt.\n- Saving writes the cards of the deck. What was in the file and is no card (a line without a front) is not kept; the file that was there is copied to _name.bak.tsv.\n- Save the file as CSV UTF-8 (not UTF-16, not a spreadsheet's own format). A file over 4 MiB or 20,000 lines is not read: split it.\n- A line you delete in the file does not delete the card in the deck, unless you switch on Remove missing cards for that deck. Then the card goes with what you learnt.\n- Files whose names start with _ are not read.\n"
