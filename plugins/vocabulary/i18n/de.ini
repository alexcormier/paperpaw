vocabulary.sd.readme = "Karteikarten aus Dateien\n\nLege hier für jeden Stapel eine Datei ab: Spanisch.tsv macht den Stapel Spanisch.\nDateien: .tsv, .csv oder .txt, gespeichert als UTF-8.\n\nEine Karte je Zeile: Vorderseite, Rückseite und ein Beispiel (freiwillig), getrennt durch Tab, Komma oder Semikolon. Die erste Zeile darf die Spalten benennen: front, back, example. Beispiel:\n\nKatze\tcat\tDie Katze schläft.\n\nÖffne dann Karteikarten auf dem Gerät, wähle Karten von der SD-Karte und dann Stapel von der Karte aktualisieren.\n\nGut zu wissen:\n- Die Stapel bleiben auf dem Gerät, mit deinem Lernstand. Eine Datei wird gelesen, wenn sie neu oder geändert ist; ihre Karten werden dem Stapel hinzugefügt oder dort geändert.\n- Änderst du Rückseite oder Beispiel einer Karte in der Datei, ändert sich die Karte und behält deinen Lernstand.\n- Änderst du den Text der Vorderseite, zählt das als neue Karte, und die alte fängt von vorn an. Karten werden an ihrem Text der Vorderseite erkannt; Leerzeichen und Groß-/Kleinschreibung zählen nicht. Speicherst du einen Stapel in eine Datei (Karten von der SD-Karte, Stapel auf der Karte speichern), hat jede Karte eine Nummer in der Spalte id: Änderst du dort eine Vorderseite und lässt die ersten beiden Zeilen der Datei, wie sie sind, behält die Karte ihren Lernstand.\n- Das Speichern schreibt die Karten des Stapels. Was in der Datei stand und keine Karte ist (eine Zeile ohne Vorderseite), bleibt nicht erhalten; die vorhandene Datei wird nach _Name.bak.tsv kopiert.\n- Speichere die Datei als CSV UTF-8 (nicht UTF-16 und nicht im eigenen Format einer Tabellenkalkulation). Eine Datei über 4 MiB oder mit mehr als 20.000 Zeilen wird nicht gelesen: teile sie.\n- Eine Zeile, die du in der Datei löschst, löscht die Karte im Stapel nicht, es sei denn, du schaltest für diesen Stapel Fehlende Karten entfernen an. Dann verschwindet die Karte samt Lernstand.\n- Dateien, deren Name mit _ beginnt, werden nicht gelesen.\n"
