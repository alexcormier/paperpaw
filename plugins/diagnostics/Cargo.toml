[package]
name = "paperpaw-plugin-diagnostics"
description = "PaperPaw diagnostics screen: gray levels, focus navigation, refresh modes"
version = "1.0.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[dependencies]
# Plugins depend on the SDK only, never on the kernel.
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true
