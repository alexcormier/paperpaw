diagnostics.check.screen.title = Screen
diagnostics.check.screen.help = Every gray level should show as its own stripe. Flip the pattern a few times: what stays of the last one is ghosting. A full refresh should clear it.
diagnostics.check.buttons.title = Buttons
diagnostics.check.buttons.help = Press each button when it is asked for. If one does not work, hold another button to go on.
diagnostics.check.touch.title = Touch
diagnostics.check.touch.help = Tap each circle at the corners and edges. The check goes on by itself once all are filled.
diagnostics.check.light.title = Front light
diagnostics.check.light.help = The light goes off, half and full, then cool and warm. Your own setting comes back at the end.
diagnostics.check.battery.title = Battery
diagnostics.check.battery.help = Plug the cable in and out: Charging should change within a minute.
diagnostics.check.card.title = Card
diagnostics.check.card.help = A file of 128 KiB is written to the card, read back and removed.
diagnostics.check.clock.title = Clock
diagnostics.check.clock.help = Compare the time and date with another clock.
diagnostics.check.wifi.title = Wi-Fi
diagnostics.check.wifi.help = Networks in reach are looked for. To join one, open the Wi-Fi page.
diagnostics.check.sleep.title = Sleep
diagnostics.check.sleep.help = Choose Sleep now, then wake the device with its power button. The check goes on, also if it is opened again from the menu.
diagnostics.check.memory.title = Memory
diagnostics.check.memory.help = The heap free now, and the stack never used since the start.
diagnostics.check.end.title = Done
diagnostics.check.end.help = The report is in .paperpaw/device-check.txt on the card. Paste it into your pull request.
