diagnostics.check.screen.title = Bildschirm
diagnostics.check.screen.help = Jede Graustufe sollte als eigener Streifen erscheinen. Kehre das Muster ein paar Mal um: Was vom letzten bleibt, sind Geisterbilder. Ganz neu aufbauen sollte sie löschen.
diagnostics.check.buttons.title = Tasten
diagnostics.check.buttons.help = Drücke jede Taste, wenn sie gefragt ist. Geht eine nicht, halte eine andere Taste, um weiterzumachen.
diagnostics.check.touch.title = Touch
diagnostics.check.touch.help = Tippe jeden Kreis an den Ecken und Rändern an. Sind alle gefüllt, geht der Check von selbst weiter.
diagnostics.check.light.title = Licht
diagnostics.check.light.help = Das Licht geht aus, auf halb und voll, dann kalt und warm. Am Ende kommt deine eigene Einstellung zurück.
diagnostics.check.battery.title = Akku
diagnostics.check.battery.help = Stecke das Kabel ein und aus: Lädt sollte sich innerhalb einer Minute ändern.
diagnostics.check.card.title = Karte
diagnostics.check.card.help = Eine Datei mit 128 KiB wird auf die Karte geschrieben, zurückgelesen und entfernt.
diagnostics.check.clock.title = Uhr
diagnostics.check.clock.help = Vergleiche Uhrzeit und Datum mit einer anderen Uhr.
diagnostics.check.wifi.title = WLAN
diagnostics.check.wifi.help = Netze in Reichweite werden gesucht. Um eines zu verbinden, öffne die WLAN-Seite.
diagnostics.check.sleep.title = Schlafen
diagnostics.check.sleep.help = Wähle Jetzt schlafen und wecke das Gerät dann mit seiner Ein-Taste. Der Check geht weiter, auch wenn du ihn wieder aus dem Menü öffnest.
diagnostics.check.memory.title = Speicher
diagnostics.check.memory.help = Der jetzt freie Heap und der seit dem Start nie benutzte Stack.
diagnostics.check.end.title = Fertig
diagnostics.check.end.help = Der Bericht liegt in .paperpaw/device-check.txt auf der Karte. Füge ihn in deinen Pull Request ein.
