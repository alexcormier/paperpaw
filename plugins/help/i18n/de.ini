[messages]
help.plugin.name = Hinweise
help.plugin.description = Zeigt beim ersten Öffnen eines Bildschirms, was seine Bedienelemente tun.
help.title = So geht es hier
help.got-it = Verstanden
help.no-more = Keine Hinweise mehr
help.section = Hinweise
help.setting.show = Hinweise für neue Bildschirme
help.setting.show.help = Beim ersten Öffnen eines Bildschirms sagt eine kurze Notiz, was seine Bedienelemente tun.
help.setting.again = Hinweise wieder zeigen
help.setting.again.help = Die Hinweise jedes Bildschirms erscheinen noch einmal, wenn er das nächste Mal öffnet.
help.again-done = Die Hinweise erscheinen wieder, wenn ein Bildschirm das nächste Mal öffnet.
help.plugin.how = "Beim ersten Öffnen eines Bildschirms sagt eine kurze Notiz darüber, was seine Bedienelemente tun: die Teile des Bildschirms, auf die ein Tippen wirkt, eingerahmt, und was die Tasten tun.\n\nEin Tippen oder eine beliebige Taste schließt die Notiz, und sie kommt für diesen Bildschirm nicht wieder. Keine Hinweise mehr schaltet alle ab.\n\nIn den Einstellungen unter System schaltet Hinweise für neue Bildschirme sie ein oder aus, und Hinweise wieder zeigen lässt die Notiz jedes Bildschirms noch einmal erscheinen."
