help.plugin.how = "The first time a screen opens, a short note over it says what its controls do: the parts of the screen a tap goes to, framed, and what the buttons do.\n\nA tap or any button closes the note, and it does not come again for that screen. No more hints switches all of them off.\n\nIn the settings, under System, Hints for new screens switches them on or off, and Show hints again has every screen's note shown once more."
