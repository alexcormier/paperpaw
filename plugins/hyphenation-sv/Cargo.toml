[package]
name = "paperpaw-plugin-hyphenation-sv"
description = "PaperPaw hyphenation patterns for Swedish"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
# The code is Apache-2.0; the patterns' licence is in patterns/README.md.
license = "Apache-2.0 AND LPPL-1.3c"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std", "text-processing"]
include = ["src", "how", "patterns", "i18n", "build.rs"]

[dependencies]
paperpaw-sdk.workspace = true

[build-dependencies]
paperpaw-hyphen.workspace = true

[dev-dependencies]
# The tests look at what the plugin adds, as the kernel does.
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[lints]
workspace = true
