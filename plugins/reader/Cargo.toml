[package]
name = "paperpaw-plugin-reader"
description = "PaperPaw paged reader: page layout, progress, background pagination"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[dependencies]
paperpaw-sdk = { workspace = true, features = ["unstable"] }

[dev-dependencies]
paperpaw-i18n.workspace = true
paperpaw-core.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-format-epub.workspace = true
paperpaw-plugin-format-txt.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-zip = { workspace = true, features = ["testing"] }
proptest.workspace = true

[lints]
workspace = true
