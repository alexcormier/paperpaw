[meta]
language = en
name = English
plural = one-other

[messages]
plugin-manager.plugin.name = Plugin manager
plugin-manager.plugin.description = Lists the plugins and switches them on and off.
plugin-manager.title = Plugins
plugin-manager.open = Manage plugins
# A menu: the entries above the list of plugins (e.g. the store).
plugin-manager.more = Plugins: above the list
plugin-manager.on = On
plugin-manager.off = Off
plugin-manager.always-on = Always on
plugin-manager.required = Required
plugin-manager.error = Error
plugin-manager.version = Version {version}.
plugin-manager.restart = Restart now
plugin-manager.starts-after-restart = Starts after a restart.
plugin-manager.stops-after-restart = Stops after a restart.
# {version} is the version installed, e.g. 2.0.0.
plugin-manager.updates-after-restart = Version {version} takes over after a restart.
plugin-manager.failed = Could not be loaded.
# Where a plugin came from: a store, or put in place otherwise (Wi-Fi transfer, memory card, USB, one's own build).
plugin-manager.origin.store = From the store.
plugin-manager.origin.local = Local: not from the store.
# Plugins with native code (ADR 0024), and why one does not run.
plugin-manager.code = With code.
plugin-manager.code.other-build = Built for another plugin interface of PaperPaw: it waits for a build for this one.
plugin-manager.code.damaged = Its code is damaged: install it again.
plugin-manager.code.mismatch = Its code is another plugin's: install it again.
plugin-manager.code.no-room = No room left for its code.
plugin-manager.code.unsupported = This device runs no plugins with code.
plugin-manager.code.safe-mode = Not loaded at this start (safe mode): loaded after a restart.
plugin-manager.code.safe-mode-off = Switched off by safe mode: switch the plugins with code on again one at a time.
plugin-manager.code.not-installed = Not installed from the store or the web flasher: its code does not run. Install it from there.
plugin-manager.code.changed = Its code was changed after it was installed: it does not run. Install it again.
plugin-manager.code.crashed = Switched off by safe mode: PaperPaw did not start with it. Switch it on to try again.
# The notice after a start without plugins with code (a few lines).
plugin-manager.safe-mode.failed = PaperPaw did not start: plugins with code are switched off.
plugin-manager.safe-mode.key = The key was held at the start: plugins with code are switched off.
# {name} is a plugin's name.
plugin-manager.safe-mode.crashed = {name} crashed at the start and is switched off.
plugin-manager.safe-mode.last = PaperPaw did not start. Code plugins are off; {name} was loaded last.
# Plugins chosen in the web flasher, not installed at the first start
# (a notice: three short lines at most).
plugin-manager.not-installed.other-author = {name} was not installed: signed by another key than before.
plugin-manager.not-installed.damaged = {name} was not installed: its code is damaged.
# {name}: the names of several plugins.
plugin-manager.not-installed.several = Not installed: {name}. Signed by another author or damaged.
plugin-manager.needed-for = Needed for: {what}.
plugin-manager.slot.home = home screen
plugin-manager.slot.reader = reader
plugin-manager.slot.library = library
plugin-manager.slot.menu = menu
plugin-manager.slot.settings = settings
plugin-manager.slot.fonts = fonts
plugin-manager.slot.other = screen
plugin-manager.self = Needed to switch plugins on again.
# The bar at the bottom: before and after a plugin was switched.
plugin-manager.hint = Tap: on or off. Hold: how it works.
plugin-manager.hint.buttons = Select: on or off. Hold: how it works.
plugin-manager.restart.short = Applies after a restart.
plugin-manager.screens = Screens
plugin-manager.screens.automatic = Automatic
plugin-manager.screens.automatic.help = As the plugins order it: the one that came last of those that ask for the place first.
plugin-manager.screens.chosen = In use
plugin-manager.screens.use = Use {name} for {slot} now?
plugin-manager.screens.use.yes = Use it now
plugin-manager.screens.use.no = Not now
plugin-manager.no-how = This plugin says no more about how it works.
plugin-manager.how-failed = How it works could not be shown: the memory may be full.
