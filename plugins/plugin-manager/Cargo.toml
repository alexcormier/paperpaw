[package]
name = "paperpaw-plugin-plugin-manager"
description = "PaperPaw plugin manager: lists the plugins and switches them on and off"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[dependencies]
# Takes plugins installed by hand as the reader's own (kernel).
paperpaw-sdk = { workspace = true, features = ["kernel"] }

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }

[lints]
workspace = true
