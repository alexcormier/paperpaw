[package]
name = "paperpaw-plugin-setup"
description = "PaperPaw first-run setup: a short guide through the settings that matter, with steps from every plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]
include = ["src", "how", "i18n"]

[dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
# By path alone: the app has this plugin built in, so a version here
# would make the two wait for each other on crates.io; cargo publish
# leaves a dev-dependency without one out.
paperpaw-app = { path = "../../crates/paperpaw-app" }
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
proptest.workspace = true

[lints]
workspace = true
