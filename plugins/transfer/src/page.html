<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PaperPaw</title>
<style>
:root{color-scheme:light dark;--fg:#111;--bg:#fff;--line:#ddd;--mute:#666}
@media (prefers-color-scheme:dark){:root{--fg:#eee;--bg:#161616;--line:#333;--mute:#999}}
body{margin:0;font:16px/1.4 system-ui,sans-serif;color:var(--fg);background:var(--bg)}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 8px}
nav{margin-bottom:12px;color:var(--mute);overflow-wrap:anywhere}
nav a{color:inherit}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button,.btn{font:inherit;padding:8px 14px;border:1px solid var(--fg);background:var(--bg);color:var(--fg);border-radius:6px;cursor:pointer}
#drop{border:2px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--mute);margin-bottom:12px}
#drop.over{border-color:var(--fg)}
#status{min-height:1.4em;color:var(--mute);margin-bottom:8px}
#target{margin-bottom:8px;overflow-wrap:anywhere}
#hint{border:1px solid var(--fg);border-radius:8px;padding:12px;margin-bottom:12px}
#hint p{margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
li .acts{display:flex;gap:6px;margin-left:auto}
#moving{border:1px solid var(--fg);border-radius:8px;padding:12px;margin-bottom:12px}
#moving p{margin:0 0 8px;overflow-wrap:anywhere}
li a{flex:1 1 12em;min-width:0;color:var(--fg);text-decoration:none;overflow-wrap:anywhere}
li .size{color:var(--mute);white-space:nowrap}
li button{padding:4px 10px}
</style>
</head>
<body>
<main>
<h1 id="title"></h1>
<nav id="path"></nav>
<div class="bar">
<label class="btn"><input type="file" id="files" multiple hidden><span id="upload"></span></label>
<button id="mkdir"></button>
</div>
<div id="target"></div>
<div id="moving" hidden><p id="movingText"></p><div class="bar"><button id="moveHere"></button><button id="moveCancel"></button></div></div>
<div id="hint" hidden><p id="outside"></p><div class="bar"><button id="toLibrary"></button><button id="here"></button></div></div>
<div id="drop"></div>
<div id="status"></div>
<ul id="list"></ul>
</main>
<script>
const T = /*STRINGS*/{};
const key = new URLSearchParams(location.search).get('k') || '';
const $ = id => document.getElementById(id);
const join = (dir, name) => dir ? dir + '/' + name : name;
const query = path => 'k=' + encodeURIComponent(key) + '&path=' + encodeURIComponent(path);
const named = (text, name) => text.replace('{name}', name);
const dir = () => decodeURIComponent(location.hash.slice(1));
const say = text => $('status').textContent = text;
// A folder as the reader names it: from the top of the card.
const shown = path => '/' + path;

function size(bytes) {
  const units = ['B', 'KB', 'MB', 'GB'];
  let i = 0;
  while (bytes >= 1024 && i < 3) { bytes /= 1024; i++; }
  return (i ? bytes.toLocaleString(undefined, {maximumFractionDigits: 1}) : bytes) + ' ' + units[i];
}

function open(path) { location.hash = encodeURIComponent(path); }

// Only the latest listing asked for is shown: one asked before it (a
// folder left meanwhile) is dropped.
let listing = 0;
// What is being moved: the folder it goes to is opened, then "Move here".
let moving = null;

async function move(from, to, name) {
  let q = '/api/move?' + query(from) + '&to=' + encodeURIComponent(to);
  if (name) q += '&name=' + encodeURIComponent(name);
  const answer = await fetch(q, {method: 'POST'});
  say(answer.ok ? T.done : T.failed);
  load();
}

function showMoving() {
  const box = $('moving');
  box.hidden = !moving;
  if (!moving) return;
  $('movingText').textContent = named(T.moving, moving.name);
  $('moveHere').textContent = T.moveHere;
  $('moveCancel').textContent = T.cancel;
  $('moveHere').onclick = () => { const m = moving; moving = null; showMoving(); move(m.path, dir()); };
  $('moveCancel').onclick = () => { moving = null; showMoving(); };
}

async function load() {
  const mine = ++listing;
  const here = dir();
  const nav = $('path');
  nav.textContent = '';
  const crumb = (label, path) => {
    const a = document.createElement('a');
    a.href = '#'; a.textContent = label;
    a.onclick = e => { e.preventDefault(); open(path); };
    nav.append(a);
  };
  crumb(T.device, '');
  $('target').textContent = T.target.replace('{folder}', shown(here));
  let path = '';
  for (const part of here ? here.split('/') : []) {
    path = join(path, part);
    nav.append(' / ');
    crumb(part, path);
  }
  const list = $('list');
  // Big folders come in parts.
  const entries = [];
  let from = 0;
  while (from !== undefined) {
    const answer = await fetch('/api/list?' + query(here) + (from ? '&from=' + from : ''));
    // The library's folder not there (yet): the top of the card.
    if (!answer.ok && here && here === T.library) { open(''); return; }
    if (!answer.ok) { say(T.failed); return; }
    const part = await answer.json();
    if (mine !== listing) return;
    entries.push(...part.entries);
    from = part.next;
  }
  if (mine !== listing) return;
  list.textContent = '';
  // Folders first, then by name.
  entries.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name, undefined, {sensitivity: 'base'}));
  if (!entries.length) {
    const li = document.createElement('li');
    li.textContent = T.empty;
    list.append(li);
  }
  for (const entry of entries) {
    const path = join(here, entry.name);
    const li = document.createElement('li');
    const a = document.createElement('a');
    if (entry.dir) {
      a.href = '#'; a.textContent = entry.name + '/';
      a.onclick = e => { e.preventDefault(); open(path); };
    } else {
      a.href = '/api/file?' + query(path); a.download = entry.name;
      a.textContent = entry.name;
    }
    li.append(a);
    if (!entry.dir) {
      const s = document.createElement('span');
      s.className = 'size'; s.textContent = size(entry.size);
      li.append(s);
    }
    const acts = document.createElement('span');
    acts.className = 'acts';
    const action = (label, run) => {
      const b = document.createElement('button');
      b.textContent = label; b.onclick = run;
      acts.append(b);
      return b;
    };
    action(T.move, () => { moving = {path, name: entry.name}; showMoving(); window.scrollTo(0, 0); });
    action(T.rename, () => {
      const name = prompt(T.newName, entry.name);
      if (name && name !== entry.name) move(path, here, name);
    });
    const remove = action(T.delete, null);
    remove.onclick = async () => {
      if (!confirm(named(T.deleteQuestion, entry.name))) return;
      const answer = await fetch('/api/delete?' + query(path), {method: 'POST'});
      say(answer.ok ? T.done : T.failed);
      load();
    };
    li.append(acts);
    list.append(li);
  }
}

function put(file, folder) {
  return new Promise((done, fail) => {
    const request = new XMLHttpRequest();
    request.open('PUT', '/api/file?' + query(join(folder, file.name)));
    request.upload.onprogress = e => {
      if (e.lengthComputable) say(named(T.uploading, file.name) + ' ' + Math.round(e.loaded * 100 / e.total) + ' %');
    };
    request.onload = () => request.status == 200 ? done() : fail();
    request.onerror = fail;
    request.send(file);
  });
}

async function send(files, folder) {
  for (const file of files) {
    try { await put(file, folder); } catch (e) { say(T.failed + ' (' + file.name + ')'); load(); return; }
  }
  say(T.done);
  load();
}

// Whether the library reads what is in `folder`: it or one in it.
const inLibrary = folder => {
  const [a, b] = [folder.toLowerCase(), T.library.toLowerCase()];
  return !b || a === b || a.startsWith(b + '/');
};
const isBook = name => T.books.some(e => name.toLowerCase().endsWith('.' + e));

// Books sent where the library does not read them: said, with the
// library's folder offered instead; sending them here stays possible.
function upload(files) {
  const here = dir();
  const hint = $('hint');
  if (inLibrary(here) || !files.some(f => isBook(f.name))) { hint.hidden = true; send(files, here); return; }
  $('outside').textContent = T.outside;
  $('toLibrary').textContent = T.toLibrary.replace('{folder}', shown(T.library));
  $('here').textContent = T.here;
  $('toLibrary').onclick = () => { hint.hidden = true; send(files, T.library).then(() => open(T.library)); };
  $('here').onclick = () => { hint.hidden = true; send(files, here); };
  hint.hidden = false;
}

showMoving();
$('title').textContent = T.title;
document.title = T.name;
$('upload').textContent = T.upload;
$('mkdir').textContent = T.newFolder;
$('drop').textContent = T.drop;
$('files').onchange = e => { upload([...e.target.files]); e.target.value = ''; };
$('mkdir').onclick = async () => {
  const name = prompt(T.folderName);
  if (!name) return;
  const answer = await fetch('/api/mkdir?' + query(join(dir(), name)), {method: 'POST'});
  say(answer.ok ? T.done : T.failed);
  load();
};
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); upload([...e.dataTransfer.files]); };
window.onhashchange = load;
// Opened at the library's folder, where books go.
if (!location.hash && T.library) open(T.library); else load();
</script>
</body>
</html>
