[package]
name = "paperpaw-plugin-reading-goal"
description = "PaperPaw reading goal: minutes to read a day, and a cat on the home screen whose mood follows today's reading"
version = "1.0.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories = ["no-std"]

[package.metadata.paperpaw]
# What the plugin reads from its folder on the card: the store's package
# holds these files (tools/plugin-files/catalogue.py).
card-files = ["pictures/*.png"]

[features]
# The cats carried in the code (the plugin as part of an app); a plugin file
# for a reader is built without them and reads them from its folder.
default = ["embedded-pictures"]
embedded-pictures = []

[dependencies]
paperpaw-sdk.workspace = true

[dev-dependencies]
paperpaw-core.workspace = true
paperpaw-i18n.workspace = true
paperpaw-platform.workspace = true
paperpaw-plugin-fonts-default = { workspace = true, features = ["packs"] }
paperpaw-plugin-home.workspace = true
paperpaw-plugin-sleep.workspace = true
paperpaw-plugin-stats.workspace = true

[lints]
workspace = true
