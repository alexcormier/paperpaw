reading-goal.plugin.how = "A cat on your home screen shows how today's reading goes: sad while you have not read yet, so-so after a little, content from half of your daily goal, happy once you have reached it.\n\nAdd the widget Reading cat to the home screen (hold the home screen, then add a widget), or choose Today's reading cat as the sleep screen. A tap on the cat opens the daily goal; it is the goal of the reading statistics, which count the minutes you read.\n\nIn the settings, under Reading, Content from and Happy from set from which share of the goal the cat is content or happy, and Own pictures a folder of pictures (sad, meh, content and happy) to show instead of the cats."
