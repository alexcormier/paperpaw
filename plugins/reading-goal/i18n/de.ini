reading-goal.plugin.name = Leseziel
reading-goal.plugin.description = Minuten zum Lesen am Tag und eine Katze auf dem Startbildschirm, deren Laune dem heutigen Lesen folgt.
reading-goal.title = Leseziel
reading-goal.setting.content = Zufrieden ab
reading-goal.setting.content.help = Ab welchem Anteil des Ziels die Katze zufrieden ist statt nur so lala.
reading-goal.setting.happy = Glücklich ab
reading-goal.setting.happy.help = Ab welchem Anteil des Ziels die Katze glücklich ist. 100 % ist das Ziel selbst.
