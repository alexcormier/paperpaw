# cargo-deny configuration: license compliance and supply-chain checks.
# See docs/adr/0002-apache-2-license.md.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Unmaintained, used only while building the X4 firmware, by esp-hal's
    # crates (nothing of them is in the firmware): `paste`, a proc-macro of
    # esp-hal, and `unsafe-libyaml`, below the build script of esp-config.
    # To go when esp-hal moves on.
    { id = "RUSTSEC-2024-0436", reason = "build time only, from esp-hal" },
    { id = "RUSTSEC-2024-0449", reason = "build time only, from esp-config" },
    # crypto-bigint 0.5 (timing variability), below p256 0.13 that
    # trouble-host uses for Bluetooth LE Secure Connections pairing: one
    # ECDH with a fresh key per pairing, which leaves no way to time the
    # same secret again and again. To go when trouble-host moves to a p256
    # on crypto-bigint 0.7.
    { id = "RUSTSEC-2026-0387", reason = "BLE pairing ECDH with fresh keys, via trouble-host's p256 0.13" },
]

[licenses]
version = 2
# Only licenses compatible with distributing PaperPaw under Apache-2.0.
# Copyleft licenses are deliberately absent.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # Fonts only (plugins/fonts-default): the SIL Open Font License permits
    # bundling fonts with software under any license.
    "OFL-1.1",
    # Hyphenation patterns only (plugins/hyphenation): the FSF all-permissive
    # license of the American English patterns.
    "FSFAP",
    # Hyphenation patterns only (plugins/hyphenation-sv, -ru): the LaTeX
    # Project Public License, which lets unmodified files be distributed.
    "LPPL-1.3c",
    # The X4's TCP/IP stack (smoltcp): zero-clause BSD, no conditions.
    "0BSD",
    # Data only (the X4's TLS): Mozilla's root certificates as webpki-roots
    # keeps them, under the permissive Community Data License Agreement.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# FAT with long file names and no_std (paperpaw-fat, the X4's SD card):
# not released yet, so pinned to a commit.
allow-git = ["https://github.com/rafalh/rust-fatfs"]
